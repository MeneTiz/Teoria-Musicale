è il metodo più utile per un confronto?","options":["Cambiare tutto insieme","Cambiare una variabile e prevedere il risultato","Scegliere sempre il suono più forte"],"answer":1,"explanation":"Cambiare una variabile permette di collegare il gesto al risultato; una previsione rende l’ascolto attivo.","text":"# Dalla nota al suono: il percorso\n\n## Come usare questa guida\nQuesta guida collega tre competenze: **capire la musica**, **progettare i suoni**, **organizzarli in un brano**. Sono collegate, ma non equivalenti: conoscere la serie armonica non basta a scegliere una progressione; conoscere gli accordi non basta a controllare un filtro.\n\nSegui prima i capitoli 1–12. Passa poi ad arrangiamento e forma, quindi alla fisica del suono. Ogni laboratorio propone una variabile da cambiare, qualcosa da ascoltare e una conclusione da verificare. Non serve leggere tutto in una volta: una lezione, dieci minuti di prove e un breve esempio nel tuo progetto sono un buon ritmo.\n\n## Convenzioni sempre visibili\nLe note usano **C (Do), D (Re), E (Mi), F (Fa), G (Sol), A (La), B (Si)**. ♯ significa diesis, ♭ bemolle. La numerazione scientifica assegna 440 Hz ad A4 (La4), con C4 (Do4) come Do centrale. Alcune DAW chiamano le stesse note con un’ottava diversa: confronta numero MIDI e frequenza, non solo l’etichetta. MIDI 60 è qui C4 (Do4).\n\nUna sigla come **Cm7 (Do minore settima)** indica un accordo, non una nota. I numeri arabi indicano gradi di scala; i numeri romani indicano accordi rispetto alla tonalità. Le formule 1–♭3–5 descrivono distanze dalla fondamentale; le lettere dei controlli dell’inviluppo sono parametri, non nomi di note.\n\n## Tre letture dello stesso concetto\n**Musicale:** che relazione sento? **Visiva:** che distanza o movimento vedo? **Fisica:** che frequenza, durata o spettro cambia? Quando il tema è difficile troverai queste prospettive affiancate. Un disegno è un modello: non è una misura del tuo impianto o della tua stanza.\n\n## Metodo di ascolto\nAvvia l’audio con un clic e parti da un volume comodo. Tutti gli esempi sono sintetizzati localmente, senza registrazioni esterne. Il tasto «Ferma audio» e Esc interrompono le prove. Le modifiche si ascoltano rilanciando l’esempio, così ogni confronto parte dall’inizio. I laboratori timbrici non sono normalizzati alla stessa loudness: evita di scambiare “più forte” con “migliore”.\n\n## Traguardo finale\nCostruire un’idea di 16 battute, riconoscerne centro tonale e intervalli, scegliere rivolti leggibili, riservare spazio al basso e spiegare il ruolo di inviluppo, filtro e dinamica. Salva negli appunti una previsione prima di ascoltare e il risultato dopo.\n\n\u003c!-- LAB:overview | Implementato nell’HTML; vedi laboratori.js. -->\n\n## Verifica\n\nQual è il metodo più utile per un confronto?\n\n1. Cambiare tutto insieme\n2. Cambiare una variabile e prevedere il risultato\n3. Scegliere sempre il suono più forte\n\n\u003cdetails>\u003csummary>Soluzione ragionata\u003c/summary>\n\nCambiare una variabile permette di collegare il gesto al risultato; una previsione rende l’ascolto attivo.\n\n\u003c/details>\n","html":"\u003ch2>Come usare questa guida\u003c/h2>\n\u003cp>Questa guida collega tre competenze: \u003cstrong>capire la musica\u003c/strong>, \u003cstrong>progettare i suoni\u003c/strong>, \u003cstrong>organizzarli in un brano\u003c/strong>. Sono collegate, ma non equivalenti: conoscere la serie armonica non basta a scegliere una progressione; conoscere gli accordi non basta a controllare un filtro.\u003c/p>\n\u003cp>Segui prima i capitoli 1–12. Passa poi ad arrangiamento e forma, quindi alla fisica del suono. Ogni laboratorio propone una variabile da cambiare, qualcosa da ascoltare e una conclusione da verificare. Non serve leggere tutto in una volta: una lezione, dieci minuti di prove e un breve esempio nel tuo progetto sono un buon ritmo.\u003c/p>\n\u003ch2>Convenzioni sempre visibili\u003c/h2>\n\u003cp>Le note usano \u003cstrong>C (Do), D (Re), E (Mi), F (Fa), G (Sol), A (La), B (Si)\u003c/strong>. ♯ significa diesis, ♭ bemolle. La numerazione scientifica assegna 440 Hz ad A4 (La4), con C4 (Do4) come Do centrale. Alcune DAW chiamano le stesse note con un’ottava diversa: confronta numero MIDI e frequenza, non solo l’etichetta. MIDI 60 è qui C4 (Do4).\u003c/p>\n\u003cp>Una sigla come \u003cstrong>Cm7 (Do minore settima)\u003c/strong> indica un accordo, non una nota. I numeri arabi indicano gradi di scala; i numeri romani indicano accordi rispetto alla tonalità. Le formule 1–♭3–5 descrivono distanze dalla fondamentale; le lettere dei controlli dell’inviluppo sono parametri, non nomi di note.\u003c/p>\n\u003ch2>Tre letture dello stesso concetto\u003c/h2>\n\u003cp>\u003cstrong>Musicale:\u003c/strong> che relazione sento? \u003cstrong>Visiva:\u003c/strong> che distanza o movimento vedo? \u003cstrong>Fisica:\u003c/strong> che frequenza, durata o spettro cambia? Quando il tema è difficile troverai queste prospettive affiancate. Un disegno è un modello: non è una misura del tuo impianto o della tua stanza.\u003c/p>\n\u003ch2>Metodo di ascolto\u003c/h2>\n\u003cp>Avvia l’audio con un clic e parti da un volume comodo. Tutti gli esempi sono sintetizzati localmente, senza registrazioni esterne. Il tasto «Ferma audio» e Esc interrompono le prove. Le modifiche si ascoltano rilanciando l’esempio, così ogni confronto parte dall’inizio. I laboratori timbrici non sono normalizzati alla stessa loudness: evita di scambiare “più forte” con “migliore”.\u003c/p>\n\u003ch2>Traguardo finale\u003c/h2>\n\u003cp>Costruire un’idea di 16 battute, riconoscerne centro tonale e intervalli, scegliere rivolti leggibili, riservare spazio al basso e spiegare il ruolo di inviluppo, filtro e dinamica. Salva negli appunti una previsione prima di ascoltare e il risultato dopo.\u003c/p>\n\u003cdiv id=\"lab-root\">\u003c/div>\n\n"},{"id":"01-ritmo","title":"Ritmo, tempo e griglia","group":1,"lab":"rhythm","question":"In 4/4 a 120 BPM, quanto dura una battuta?","options":["500 ms","2 secondi","4 secondi"],"answer":1,"explanation":"Quattro quarti da 0,5 secondi producono una battuta di 2 secondi.","text":"# Ritmo, tempo e griglia\n\n## Quattro parole, quattro funzioni\nIl **tempo** indica la velocità della pulsazione; il **metro** organizza gli accenti ricorrenti; il **ritmo** dispone eventi e pause; la **griglia** è il riferimento visivo per posizionarli. In 4/4 trovi quattro movimenti da un quarto. A 120 BPM, assumendo il quarto come pulsazione, ogni quarto dura 60/120 = 0,5 secondi; una battuta dura 2 secondi.\n\n| Valore | Durata in quarti | A 120 BPM |\n|---|---|---|\n| Intero | 4 | 2 s |\n| Metà | 2 | 1 s |\n| Quarto | 1 | 500 ms |\n| Ottavo | 1/2 | 250 ms |\n| Sedicesimo | 1/4 | 125 ms |\n\nUn punto aggiunge metà del valore: un quarto puntato vale 1,5 quarti. La legatura somma durate della stessa altezza; una pausa occupa tempo senza suonare. Una terzina divide in tre parti lo spazio normalmente occupato da due valori dello stesso tipo.\n\n## Accento e groove\nIn 6/8 si sentono spesso **due pulsazioni da un quarto puntato**, ciascuna divisa in tre ottavi. Non basta contare sei caselle per descrivere il metro. Una sincope mette in rilievo una posizione debole o prolunga un evento attraverso una posizione forte. Lo swing rende diseguali due suddivisioni: 50% significa coppia pari, circa 67% una proporzione 2:1. Non tutti gli swing sono terzinati.\n\nLa quantizzazione sposta gli eventi verso la griglia; intensità, durata e piccoli scarti possono restare espressivi. “Umano” non significa spostare tutto a caso.\n\n## Prova guidata\nNel sequencer disegna quattro colpi sui movimenti, poi aggiungi i sedicesimi intermedi. Porta lo swing da 50% a 67%. Ascolta lo spostamento degli eventi dispari, mentre la durata della battuta resta uguale. Infine togli un colpo: una pausa può creare più slancio di una nota in più.\n\n\u003c!-- LAB:rhythm | Implementato nell’HTML; vedi laboratori.js. -->\n\n## Verifica\n\nIn 4/4 a 120 BPM, quanto dura una battuta?\n\n1. 500 ms\n2. 2 secondi\n3. 4 secondi\n\n\u003cdetails>\u003csummary>Soluzione ragionata\u003c/summary>\n\nQuattro quarti da 0,5 secondi producono una battuta di 2 secondi.\n\n\u003c/details>\n","html":"\u003ch2>Quattro parole, quattro funzioni\u003c/h2>\n\u003cp>Il \u003cstrong>tempo\u003c/strong> indica la velocità della pulsazione; il \u003cstrong>metro\u003c/strong> organizza gli accenti ricorrenti; il \u003cstrong>ritmo\u003c/strong> dispone eventi e pause; la \u003cstrong>griglia\u003c/strong> è il riferimento visivo per posizionarli. In 4/4 trovi quattro movimenti da un quarto. A 120 BPM, assumendo il quarto come pulsazione, ogni quarto dura 60/120 = 0,5 secondi; una battuta dura 2 secondi.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Valore\u003c/th>\n\u003cth>Durata in quarti\u003c/th>\n\u003cth>A 120 BPM\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Intero\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>2 s\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Metà\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>1 s\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Quarto\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>500 ms\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ottavo\u003c/td>\n\u003ctd>1/2\u003c/td>\n\u003ctd>250 ms\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sedicesimo\u003c/td>\n\u003ctd>1/4\u003c/td>\n\u003ctd>125 ms\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Un punto aggiunge metà del valore: un quarto puntato vale 1,5 quarti. La legatura somma durate della stessa altezza; una pausa occupa tempo senza suonare. Una terzina divide in tre parti lo spazio normalmente occupato da due valori dello stesso tipo.\u003c/p>\n\u003ch2>Accento e groove\u003c/h2>\n\u003cp>In 6/8 si sentono spesso \u003cstrong>due pulsazioni da un quarto puntato\u003c/strong>, ciascuna divisa in tre ottavi. Non basta contare sei caselle per descrivere il metro. Una sincope mette in rilievo una posizione debole o prolunga un evento attraverso una posizione forte. Lo swing rende diseguali due suddivisioni: 50% significa coppia pari, circa 67% una proporzione 2:1. Non tutti gli swing sono terzinati.\u003c/p>\n\u003cp>La quantizzazione sposta gli eventi verso la griglia; intensità, durata e piccoli scarti possono restare espressivi. “Umano” non significa spostare tutto a caso.\u003c/p>\n\u003ch2>Prova guidata\u003c/h2>\n\u003cp>Nel sequencer disegna quattro colpi sui movimenti, poi aggiungi i sedicesimi intermedi. Porta lo swing da 50% a 67%. Ascolta lo spostamento degli eventi dispari, mentre la durata della battuta resta uguale. Infine togli un colpo: una pausa può creare più slancio di una nota in più.\u003c/p>\n\u003cdiv id=\"lab-root\">\u003c/div>\n\n"},{"id":"02-note","title":"Note, altezze e frequenze","group":1,"lab":"pitch","question":"Che cosa resta uguale in tutte le ottave?","options":["La differenza in hertz","Il rapporto di frequenza 2:1","Il numero di armoniche"],"answer":1,"explanation":"L’ottava raddoppia la frequenza. La differenza assoluta cambia con il registro.","text":"# Note, altezze e frequenze\n\n## Nome, registro, frequenza\nUna **classe di altezza** raggruppa le note separate da ottave: C3 (Do3) e C4 (Do4) condividono il nome, ma non la frequenza. Il registro distingue in quale zona ci troviamo. La frequenza misura cicli al secondo, in hertz; l’altezza è la qualità percettiva con cui ordiniamo i suoni da gravi ad acuti.\n\nNel temperamento equabile a 12 suoni ogni semitono moltiplica la frequenza per 2^(1/12), circa 1,05946. Dodici moltiplicazioni producono un raddoppio: l’ottava. La distanza musicale è quindi **proporzionale**, non una differenza fissa in hertz.\n\n## La stessa idea in tre modi\n**Tastiera:** salire di dodici tasti, contando anche quelli neri, significa salire di un’ottava. **Onda:** nello stesso intervallo di tempo compaiono il doppio dei cicli. **Formula:** f = 440 × 2^((m−69)/12), dove m è il numero MIDI. MIDI 69 è A4 (La4), MIDI 60 è C4 (Do4), circa 261,63 Hz.\n\nDa A3 (La3), 220 Hz, ad A4 (La4), 440 Hz, la differenza è 220 Hz; da A4 (La4) ad A5 (La5), 880 Hz, è 440 Hz. Entrambe sono ottave. Il periodo T = 1/f: 100 Hz significa un ciclo ogni 10 ms.\n\n## Alterazioni ed enarmonia\n♯ alza di un semitono, ♭ abbassa di un semitono, ♮ annulla un’alterazione. Fra E (Mi) e F (Fa), e fra B (Si) e C (Do), c’è già un semitono. Nel sistema equabile C♯ (Do♯) e D♭ (Re♭) condividono il tasto ma hanno funzioni scritte diverse. I nomi dipendono dalla scala e dall’accordo, non solo dal tasto.\n\n## Cent e accordatura\nUn semitono equabile contiene 100 cent; un’ottava 1200. Per due frequenze: cent = 1200 × log₂(f₂/f₁). Il riferimento a 440 Hz è una convenzione, non una proprietà naturale della nota. Un rumore può avere energia in molte frequenze senza un’altezza univoca; un suono complesso può invece evocare una fondamentale anche se quella componente manca.\n\n## Prova guidata\nAscolta una nota e la sua ottava nel laboratorio. Poi spostati di un solo semitono: non stai aggiungendo sempre lo stesso numero di hertz. In Ableton confronta il nome mostrato dal piano roll con il numero MIDI quando trasferisci gli esempi.\n\n\u003c!-- LAB:pitch | Implementato nell’HTML; vedi laboratori.js. -->\n\n## Verifica\n\nChe cosa resta uguale in tutte le ottave?\n\n1. La differenza in hertz\n2. Il rapporto di frequenza 2:1\n3. Il numero di armoniche\n\n\u003cdetails>\u003csummary>Soluzione ragionata\u003c/summary>\n\nL’ottava raddoppia la frequenza. La differenza assoluta cambia con il registro.\n\n\u003c/details>\n","html":"\u003ch2>Nome, registro, frequenza\u003c/h2>\n\u003cp>Una \u003cstrong>classe di altezza\u003c/strong> raggruppa le note separate da ottave: C3 (Do3) e C4 (Do4) condividono il nome, ma non la frequenza. Il registro distingue in quale zona ci troviamo. La frequenza misura cicli al secondo, in hertz; l’altezza è la qualità percettiva con cui ordiniamo i suoni da gravi ad acuti.\u003c/p>\n\u003cp>Nel temperamento equabile a 12 suoni ogni semitono moltiplica la frequenza per 2^(1/12), circa 1,05946. Dodici moltiplicazioni producono un raddoppio: l’ottava. La distanza musicale è quindi \u003cstrong>proporzionale\u003c/strong>, non una differenza fissa in hertz.\u003c/p>\n\u003ch2>La stessa idea in tre modi\u003c/h2>\n\u003cp>\u003cstrong>Tastiera:\u003c/strong> salire di dodici tasti, contando anche quelli neri, significa salire di un’ottava. \u003cstrong>Onda:\u003c/strong> nello stesso intervallo di tempo compaiono il doppio dei cicli. \u003cstrong>Formula:\u003c/strong> f = 440 × 2^((m−69)/12), dove m è il numero MIDI. MIDI 69 è A4 (La4), MIDI 60 è C4 (Do4), circa 261,63 Hz.\u003c/p>\n\u003cp>Da A3 (La3), 220 Hz, ad A4 (La4), 440 Hz, la differenza è 220 Hz; da A4 (La4) ad A5 (La5), 880 Hz, è 440 Hz. Entrambe sono ottave. Il periodo T = 1/f: 100 Hz significa un ciclo ogni 10 ms.\u003c/p>\n\u003ch2>Alterazioni ed enarmonia\u003c/h2>\n\u003cp>♯ alza di un semitono, ♭ abbassa di un semitono, ♮ annulla un’alterazione. Fra E (Mi) e F (Fa), e fra B (Si) e C (Do), c’è già un semitono. Nel sistema equabile C♯ (Do♯) e D♭ (Re♭) condividono il tasto ma hanno funzioni scritte diverse. I nomi dipendono dalla scala e dall’accordo, non solo dal tasto.\u003c/p>\n\u003ch2>Cent e accordatura\u003c/h2>\n\u003cp>Un semitono equabile contiene 100 cent; un’ottava 1200. Per due frequenze: cent = 1200 × log₂(f₂/f₁). Il riferimento a 440 Hz è una convenzione, non una proprietà naturale della nota. Un rumore può avere energia in molte frequenze senza un’altezza univoca; un suono complesso può invece evocare una fondamentale anche se quella componente manca.\u003c/p>\n\u003ch2>Prova guidata\u003c/h2>\n\u003cp>Ascolta una nota e la sua ottava nel laboratorio. Poi spostati di un solo semitono: non stai aggiungendo sempre lo stesso numero di hertz. In Ableton confronta il nome mostrato dal piano roll con il numero MIDI quando trasferisci gli esempi.\u003c/p>\n\u003cdiv id=\"lab-root\">\u003c/div>\n\n"},{"id":"03-lettura","title":"Leggere musica e piano roll","group":1,"lab":"notation","question":"La lunghezza di una nota MIDI determina sempre tutta la coda sonora?","options":["Sì","No, il release può proseguire dopo il gate","Solo se la velocity è alta"],"answer":1,"explanation":"Il note-off avvia la fase di rilascio. La durata del suono dipende anche dall’inviluppo.","text":"# Leggere musica e piano roll\n\n## Due rappresentazioni compatibili\nIl pentagramma mette il tempo da sinistra a destra e l’altezza dal basso verso l’alto. Le linee e gli spazi si alternano; la chiave assegna i nomi alle posizioni. In chiave di violino le linee, dal basso, sono E (Mi), G (Sol), B (Si), D (Re), F (Fa); gli spazi F (Fa), A (La), C (Do), E (Mi). I tagli addizionali proseguono il sistema: C4 (Do4) si trova sul primo taglio sotto il pentagramma in chiave di violino.\n\nIn chiave di basso le linee sono G (Sol), B (Si), D (Re), F (Fa), A (La). C4 (Do4) si trova sul primo taglio sopra. Il piano roll usa invece una riga per ogni semitono: una distanza verticale identica rappresenta sempre lo stesso numero di semitoni, mentre sul pentagramma la distanza grafica conta lettere, non semitoni.\n\n## Che cosa descrive una nota MIDI\nLa posizione orizzontale è l’inizio; la lunghezza è la durata del gate; la riga è il numero di nota; la velocity è un dato espressivo. Velocity non è necessariamente volume: lo strumento può usarla per filtro, attacco o scelta del campione. Il gate non coincide con la durata udibile se il suono ha una coda di release.\n\n## Armatura e alterazioni locali\nL’armatura all’inizio del rigo definisce le alterazioni di base. Nella notazione moderna un’alterazione occasionale vale normalmente per la stessa nota e ottava fino alla stanghetta della battuta, con convenzioni per legature e richiami di cortesia. Nel piano roll non vedi automaticamente questo significato grammaticale: due note enarmoniche possono apparire identiche.\n\n## Leggere una sigla senza indovinare\n**Cmaj7 (Do maggiore settima maggiore)** contiene fondamentale, terza maggiore, quinta giusta e settima maggiore. **C7 (Do settima di dominante)** usa invece una settima minore. **C/E (Do maggiore con Mi al basso)** specifica il basso. La barra non indica una divisione matematica.\n\n## Prova guidata\nSuona C4 (Do4), E4 (Mi4), G4 (Sol4) prima in sequenza, poi insieme nel laboratorio degli accordi. Nel piano roll sono tre righe; nel pentagramma una pila di terze. Il contenuto è lo stesso, cambia il modo di leggerlo. Usa il confronto fra pentagramma e piano roll qui sotto per fissare posizioni e nomi.\n\n\u003c!-- LAB:notation | Implementato nell’HTML; vedi laboratori.js. -->\n\n## Verifica\n\nLa lunghezza di una nota MIDI determina sempre tutta la coda sonora?\n\n1. Sì\n2. No, il release può proseguire dopo il gate\n3. Solo se la velocity è alta\n\n\u003cdetails>\u003csummary>Soluzione ragionata\u003c/summary>\n\nIl note-off avvia la fase di rilascio. La durata del suono dipende anche dall’inviluppo.\n\n\u003c/details>\n","html":"\u003ch2>Due rappresentazioni compatibili\u003c/h2>\n\u003cp>Il pentagramma mette il tempo da sinistra a destra e l’altezza dal basso verso l’alto. Le linee e gli spazi si alternano; la chiave assegna i nomi alle posizioni. In chiave di violino le linee, dal basso, sono E (Mi), G (Sol), B (Si), D (Re), F (Fa); gli spazi F (Fa), A (La), C (Do), E (Mi). I tagli addizionali proseguono il sistema: C4 (Do4) si trova sul primo taglio sotto il pentagramma in chiave di violino.\u003c/p>\n\u003cp>In chiave di basso le linee sono G (Sol), B (Si), D (Re), F (Fa), A (La). C4 (Do4) si trova sul primo taglio sopra. Il piano roll usa invece una riga per ogni semitono: una distanza verticale identica rappresenta sempre lo stesso numero di semitoni, mentre sul pentagramma la distanza grafica conta lettere, non semitoni.\u003c/p>\n\u003ch2>Che cosa descrive una nota MIDI\u003c/h2>\n\u003cp>La posizione orizzontale è l’inizio; la lunghezza è la durata del gate; la riga è il numero di nota; la velocity è un dato espressivo. Velocity non è necessariamente volume: lo strumento può usarla per filtro, attacco o scelta del campione. Il gate non coincide con la durata udibile se il suono ha una coda di release.\u003c/p>\n\u003ch2>Armatura e alterazioni locali\u003c/h2>\n\u003cp>L’armatura all’inizio del rigo definisce le alterazioni di base. Nella notazione moderna un’alterazione occasionale vale normalmente per la stessa nota e ottava fino alla stanghetta della battuta, con convenzioni per legature e richiami di cortesia. Nel piano roll non vedi automaticamente questo significato grammaticale: due note enarmoniche possono apparire identiche.\u003c/p>\n\u003ch2>Leggere una sigla senza indovinare\u003c/h2>\n\u003cp>\u003cstrong>Cmaj7 (Do maggiore settima maggiore)\u003c/strong> contiene fondamentale, terza maggiore, quinta giusta e settima maggiore. \u003cstrong>C7 (Do settima di dominante)\u003c/strong> usa invece una settima minore. \u003cstrong>C/E (Do maggiore con Mi al basso)\u003c/strong> specifica il basso. La barra non indica una divisione matematica.\u003c/p>\n\u003ch2>Prova guidata\u003c/h2>\n\u003cp>Suona C4 (Do4), E4 (Mi4), G4 (Sol4) prima in sequenza, poi insieme nel laboratorio degli accordi. Nel piano roll sono tre righe; nel pentagramma una pila di terze. Il contenuto è lo stesso, cambia il modo di leggerlo. Usa il confronto fra pentagramma e piano roll qui sotto per fissare posizioni e nomi.\u003c/p>\n\u003cdiv id=\"lab-root\">\u003c/div>\n\n"},{"id":"04-intervalli","title":"Intervalli: il vocabolario delle distanze","group":1,"lab":"interval","question":"Per distinguere quarta aumentata e quinta diminuita servono…","options":["Solo gli hertz","Nomi delle note e semitoni","Il volume"],"answer":1,"explanation":"La distanza in semitoni può coincidere; il numero dipende dalle lettere impiegate.","text":"# Intervalli: il vocabolario delle distanze\n\n## Numero e qualità\nUn intervallo descrive la relazione fra due altezze. **Melodico** significa note successive, **armonico** note simultanee. Il numero si ottiene contando i nomi inclusi gli estremi: C (Do)–E (Mi) attraversa tre lettere, quindi è una terza. La qualità precisa i semitoni: C (Do)–E♭ (Mi♭) è una terza minore, C (Do)–E (Mi) una terza maggiore.\n\n| Semitoni | Intervallo semplice | Esempio da C (Do) |\n|---|---|---|\n| 0 | Unisono giusto | C (Do) |\n| 1 / 2 | Seconda minore / maggiore | D♭ (Re♭) / D (Re) |\n| 3 / 4 | Terza minore / maggiore | E♭ (Mi♭) / E (Mi) |\n| 5 | Quarta giusta | F (Fa) |\n| 6 | Quarta aumentata / quinta diminuita | F♯ (Fa♯) / G♭ (Sol♭) |\n| 7 | Quinta giusta | G (Sol) |\n| 8 / 9 | Sesta minore / maggiore | A♭ (La♭) / A (La) |\n| 10 / 11 | Settima minore / maggiore | B♭ (Si♭) / B (Si) |\n| 12 | Ottava giusta | C (Do), ottava sopra |\n\n## Perché contare i tasti non basta\nC (Do)–F♯ (Fa♯) e C (Do)–G♭ (Sol♭) suonano uguali al pianoforte equabile, ma il primo è una quarta aumentata e il secondo una quinta diminuita. La scrittura racconta la direzione musicale. Gli intervalli giusti sono unisono, quarta, quinta e ottava; seconde, terze, seste e settime possono essere maggiori o minori. Aumentato aggiunge un semitono alla qualità maggiore o giusta; diminuito sottrae un semitono alla minore o giusta.\n\n## Rivolto e intervalli composti\nPortare la nota inferiore un’ottava sopra inverte l’intervallo: una terza maggiore diventa sesta minore. Nei casi semplici i numeri sommano a nove; maggiore e minore si scambiano, giusto resta giusto. Una nona è una seconda più un’ottava; un’undicesima una quarta più un’ottava. Nel voicing il registro può cambiare molto la chiarezza, pur conservando la classe dell’intervallo.\n\n## Tre prospettive sulla quinta\n**Geometria:** sette semitoni. **Frequenza:** 2^(7/12), circa 1,4983; il rapporto puro 3:2 è vicino ma non identico. **Ascolto:** spesso stabile, ma il contesto decide la funzione. Consonanza non significa “bello” e dissonanza non significa “sbagliato”. Timbro, registro e stile modificano il risultato.\n\n## Prova guidata\nConfronta 3 e 4 semitoni in sequenza e simultaneamente, poi ripeti un’ottava sotto. Canta la seconda nota prima di premere ascolta. Se sbagli, torna alla fondamentale: stai allenando una relazione, non memorizzando il timbro.\n\n\u003c!-- LAB:interval | Implementato nell’HTML; vedi laboratori.js. -->\n\n## Verifica\n\nPer distinguere quarta aumentata e quinta diminuita servono…\n\n1. Solo gli hertz\n2. Nomi delle note e semitoni\n3. Il volume\n\n\u003cdetails>\u003csummary>Soluzione ragionata\u003c/summary>\n\nLa distanza in semitoni può coincidere; il numero dipende dalle lettere impiegate.\n\n\u003c/details>\n","html":"\u003ch2>Numero e qualità\u003c/h2>\n\u003cp>Un intervallo descrive la relazione fra due altezze. \u003cstrong>Melodico\u003c/strong> significa note successive, \u003cstrong>armonico\u003c/strong> note simultanee. Il numero si ottiene contando i nomi inclusi gli estremi: C (Do)–E (Mi) attraversa tre lettere, quindi è una terza. La qualità precisa i semitoni: C (Do)–E♭ (Mi♭) è una terza minore, C (Do)–E (Mi) una terza maggiore.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Semitoni\u003c/th>\n\u003cth>Intervallo semplice\u003c/th>\n\u003cth>Esempio da C (Do)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>0\u003c/td>\n\u003ctd>Unisono giusto\u003c/td>\n\u003ctd>C (Do)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>1 / 2\u003c/td>\n\u003ctd>Seconda minore / maggiore\u003c/td>\n\u003ctd>D♭ (Re♭) / D (Re)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3 / 4\u003c/td>\n\u003ctd>Terza minore / maggiore\u003c/td>\n\u003ctd>E♭ (Mi♭) / E (Mi)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>Quarta giusta\u003c/td>\n\u003ctd>F (Fa)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>Quarta aumentata / quinta diminuita\u003c/td>\n\u003ctd>F♯ (Fa♯) / G♭ (Sol♭)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>Quinta giusta\u003c/td>\n\u003ctd>G (Sol)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>8 / 9\u003c/td>\n\u003ctd>Sesta minore / maggiore\u003c/td>\n\u003ctd>A♭ (La♭) / A (La)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10 / 11\u003c/td>\n\u003ctd>Settima minore / maggiore\u003c/td>\n\u003ctd>B♭ (Si♭) / B (Si)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>12\u003c/td>\n\u003ctd>Ottava giusta\u003c/td>\n\u003ctd>C (Do), ottava sopra\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2>Perché contare i tasti non basta\u003c/h2>\n\u003cp>C (Do)–F♯ (Fa♯) e C (Do)–G♭ (Sol♭) suonano uguali al pianoforte equabile, ma il primo è una quarta aumentata e il secondo una quinta diminuita. La scrittura racconta la direzione musicale. Gli intervalli giusti sono unisono, quarta, quinta e ottava; seconde, terze, seste e settime possono essere maggiori o minori. Aumentato aggiunge un semitono alla qualità maggiore o giusta; diminuito sottrae un semitono alla minore o giusta.\u003c/p>\n\u003ch2>Rivolto e intervalli composti\u003c/h2>\n\u003cp>Portare la nota inferiore un’ottava sopra inverte l’intervallo: una terza maggiore diventa sesta minore. Nei casi semplici i numeri sommano a nove; maggiore e minore si scambiano, giusto resta giusto. Una nona è una seconda più un’ottava; un’undicesima una quarta più un’ottava. Nel voicing il registro può cambiare molto la chiarezza, pur conservando la classe dell’intervallo.\u003c/p>\n\u003ch2>Tre prospettive sulla quinta\u003c/h2>\n\u003cp>\u003cstrong>Geometria:\u003c/strong> sette semitoni. \u003cstrong>Frequenza:\u003c/strong> 2^(7/12), circa 1,4983; il rapporto puro 3:2 è vicino ma non identico. \u003cstrong>Ascolto:\u003c/strong> spesso stabile, ma il contesto decide la funzione. Consonanza non significa “bello” e dissonanza non significa “sbagliato”. Timbro, registro e stile modificano il risultato.\u003c/p>\n\u003ch2>Prova guidata\u003c/h2>\n\u003cp>Confronta 3 e 4 semitoni in sequenza e simultaneamente, poi ripeti un’ottava sotto. Canta la seconda nota prima di premere ascolta. Se sbagli, torna alla fondamentale: stai allenando una relazione, non memorizzando il timbro.\u003c/p>\n\u003cdiv id=\"lab-root\">\u003c/div>\n\n"},{"id":"05-scale","title":"Scale, tonalità e circolo delle quinte","group":2,"lab":"scale","question":"C (Do) maggiore e C (Do) minore sono…","options":["Relative","Parallele","La stessa scala"],"answer":1,"explanation":"Hanno la stessa tonica ma una diversa struttura intervallare: sono tonalità parallele.","text":"# Scale, tonalità e circolo delle quinte\n\n## Una scala non è ancora una tonalità\nUna scala ordina un insieme di altezze. Una tonalità organizza quelle altezze intorno a una **tonica**, un centro percepito come riferimento. Usare solo i tasti bianchi non garantisce C (Do) maggiore: A (La) minore condivide quelle note. Durate, bassi, accenti e cadenze fanno sentire il centro.\n\nLa scala maggiore usa T–T–S–T–T–T–S, dove T è un tono, S un semitono. Da C (Do): C (Do), D (Re), E (Mi), F (Fa), G (Sol), A (La), B (Si). In semitoni dalla tonica: 0, 2, 4, 5, 7, 9, 11. Per trasporre sposti tutte le note della stessa distanza, mantenendo la struttura.\n\n## Tre forme della scala minore\nLa minore naturale usa 0, 2, 3, 5, 7, 8, 10. Da A (La): A (La), B (Si), C (Do), D (Re), E (Mi), F (Fa), G (Sol). La minore armonica alza il settimo grado: G♯ (Sol♯) richiama A (La) a distanza di semitono. La minore melodica ascendente alza sesto e settimo: F♯ (Fa♯), G♯ (Sol♯). Nella prassi classica discendente spesso torna naturale; nel jazz la forma melodica viene normalmente impiegata identica in entrambe le direzioni.\n\n**Relativa:** stessa armatura, tonica diversa, come C (Do) maggiore e A (La) minore. **Parallela:** stessa tonica, note diverse, come C (Do) maggiore e C (Do) minore. Questa differenza serve per capire il prestito modale.\n\n## Circolo delle quinte: una mappa, non una progressione obbligatoria\nSalendo di quinte, le tonalità maggiori aggiungono diesis: C (Do), G (Sol), D (Re), A (La), E (Mi), B (Si), F♯ (Fa♯), C♯ (Do♯). Scendendo aggiungono bemolli: F (Fa), B♭ (Si♭), E♭ (Mi♭), A♭ (La♭), D♭ (Re♭), G♭ (Sol♭), C♭ (Do♭). Alcune posizioni coincidono enarmonicamente, ma la scrittura mantiene una lettera per ciascun grado.\n\nG (Sol) maggiore ha F♯ (Fa♯); F (Fa) maggiore ha B♭ (Si♭). Le tonalità vicine condividono molte note: questo facilita collegamenti, senza imporre cosa comporre.\n\n## Prova guidata\nNel laboratorio confronta maggiore e minore naturale con **la stessa tonica**. Poi confronta minore naturale e armonica: individua il grado che cambia. Il drone ribadisce il centro, così ascolti le distanze dal riferimento e non soltanto una sequenza di tasti.\n\n\u003c!-- LAB:scale | Implementato nell’HTML; vedi laboratori.js. -->\n\n## Verifica\n\nC (Do) maggiore e C (Do) minore sono…\n\n1. Relative\n2. Parallele\n3. La stessa scala\n\n\u003cdetails>\u003csummary>Soluzione ragionata\u003c/summary>\n\nHanno la stessa tonica ma una diversa struttura intervallare: sono tonalità parallele.\n\n\u003c/details>\n","html":"\u003ch2>Una scala non è ancora una tonalità\u003c/h2>\n\u003cp>Una scala ordina un insieme di altezze. Una tonalità organizza quelle altezze intorno a una \u003cstrong>tonica\u003c/strong>, un centro percepito come riferimento. Usare solo i tasti bianchi non garantisce C (Do) maggiore: A (La) minore condivide quelle note. Durate, bassi, accenti e cadenze fanno sentire il centro.\u003c/p>\n\u003cp>La scala maggiore usa T–T–S–T–T–T–S, dove T è un tono, S un semitono. Da C (Do): C (Do), D (Re), E (Mi), F (Fa), G (Sol), A (La), B (Si). In semitoni dalla tonica: 0, 2, 4, 5, 7, 9, 11. Per trasporre sposti tutte le note della stessa distanza, mantenendo la struttura.\u003c/p>\n\u003ch2>Tre forme della scala minore\u003c/h2>\n\u003cp>La minore naturale usa 0, 2, 3, 5, 7, 8, 10. Da A (La): A (La), B (Si), C (Do), D (Re), E (Mi), F (Fa), G (Sol). La minore armonica alza il settimo grado: G♯ (Sol♯) richiama A (La) a distanza di semitono. La minore melodica ascendente alza sesto e settimo: F♯ (Fa♯), G♯ (Sol♯). Nella prassi classica discendente spesso torna naturale; nel jazz la forma melodica viene normalmente impiegata identica in entrambe le direzioni.\u003c/p>\n\u003cp>\u003cstrong>Relativa:\u003c/strong> stessa armatura, tonica diversa, come C (Do) maggiore e A (La) minore. \u003cstrong>Parallela:\u003c/strong> stessa tonica, note diverse, come C (Do) maggiore e C (Do) minore. Questa differenza serve per capire il prestito modale.\u003c/p>\n\u003ch2>Circolo delle quinte: una mappa, non una progressione obbligatoria\u003c/h2>\n\u003cp>Salendo di quinte, le tonalità maggiori aggiungono diesis: C (Do), G (Sol), D (Re), A (La), E (Mi), B (Si), F♯ (Fa♯), C♯ (Do♯). Scendendo aggiungono bemolli: F (Fa), B♭ (Si♭), E♭ (Mi♭), A♭ (La♭), D♭ (Re♭), G♭ (Sol♭), C♭ (Do♭). Alcune posizioni coincidono enarmonicamente, ma la scrittura mantiene una lettera per ciascun grado.\u003c/p>\n\u003cp>G (Sol) maggiore ha F♯ (Fa♯); F (Fa) maggiore ha B♭ (Si♭). Le tonalità vicine condividono molte note: questo facilita collegamenti, senza imporre cosa comporre.\u003c/p>\n\u003ch2>Prova guidata\u003c/h2>\n\u003cp>Nel laboratorio confronta maggiore e minore naturale con \u003cstrong>la stessa tonica\u003c/strong>. Poi confronta minore naturale e armonica: individua il grado che cambia. Il drone ribadisce il centro, così ascolti le distanze dal riferimento e non soltanto una sequenza di tasti.\u003c/p>\n\u003cdiv id=\"lab-root\">\u003c/div>\n\n"},{"id":"06-modi","title":"Modi e colore: ascoltare il centro","group":2,"lab":"modes","question":"Che cosa distingue meglio un modo nel contesto?","options":["La prima nota suonata una sola volta","Centro percepito e intervalli rispetto ad esso","Il nome del preset"],"answer":1,"explanation":"Il centro e le relazioni gerarchiche rendono udibile il modo; cominciare da una nota non è sufficiente.","text":"# Modi e colore: ascoltare il centro\n\n## Il modo è una gerarchia\nDire “suona i tasti bianchi da D (Re)” descrive le note di D (Re) dorico, ma non garantisce una musica dorica. Se la frase risolve continuamente su C (Do), potresti sentire ancora C (Do) maggiore. Servono un centro stabile e intervalli caratteristici rispetto a quel centro.\n\n| Modo | Formula rispetto alla maggiore | Grado da mettere a fuoco |\n|---|---|---|\n| Ionico | 1 2 3 4 5 6 7 | Terza e settima maggiori |\n| Dorico | 1 2 ♭3 4 5 6 ♭7 | Sesta maggiore in ambiente minore |\n| Frigio | 1 ♭2 ♭3 4 5 ♭6 ♭7 | Seconda minore |\n| Lidio | 1 2 3 ♯4 5 6 7 | Quarta aumentata |\n| Misolidio | 1 2 3 4 5 6 ♭7 | Settima minore in ambiente maggiore |\n| Eolio | 1 2 ♭3 4 5 ♭6 ♭7 | Sesta e settima minori |\n| Locrio | 1 ♭2 ♭3 4 ♭5 ♭6 ♭7 | Quinta diminuita |\n\n## Tre modi di capire il dorico\n**Ricetta:** una minore naturale con il sesto grado alzato. **Confronto parallelo:** in D (Re) eolio trovi B♭ (Si♭); in D (Re) dorico trovi B (Si). **Ascolto:** tieni D (Re) al basso e alterna una frase che tocca il sesto grado nelle due versioni. La differenza emerge senza cambiare tonica.\n\nLavorare sui modi paralleli, cioè con tonica uguale, rende evidenti i colori. Studiare i modi relativi, cioè ricavati dalle stesse note, spiega invece la parentela. Sono due strumenti diversi.\n\n## Emozione: una possibilità, non un dizionario\n“Maggiore felice, minore triste” può essere una prima associazione culturale, ma non una legge. Registro, andamento, ritmo, timbro, densità, testi e memoria personale possono ribaltare l’effetto. Una scala lidia può apparire aperta con un pad lento oppure tesa con accenti rapidi e distorsione. La quinta diminuita del locrio rende meno stabile la triade sulla tonica; non vieta di costruire un centro modale.\n\n## Pentatonica e blues\nLa pentatonica maggiore usa 1–2–3–5–6; la minore 1–♭3–4–5–♭7. Ridurre le note aiuta a costruire frasi riconoscibili. La scala blues minore aggiunge ♭5; nella pratica blues altezza e intonazione possono essere mobili, non limitate ai dodici tasti.\n\n## Prova guidata\nConfronta dorico ed eolio sopra lo stesso drone. Canta il sesto grado, quindi inventa una frase di quattro note che vi arrivi e torni alla tonica. Scrivi che cosa senti prima di leggere etichette emotive. Il laboratorio mostra anche il grado caratteristico, non soltanto le note disponibili.\n\n\u003c!-- LAB:modes | Implementato nell’HTML; vedi laboratori.js. -->\n\n## Verifica\n\nChe cosa distingue meglio un modo nel contesto?\n\n1. La prima nota suonata una sola volta\n2. Centro percepito e intervalli rispetto ad esso\n3. Il nome del preset\n\n\u003cdetails>\u003csummary>Soluzione ragionata\u003c/summary>\n\nIl centro e le relazioni gerarchiche rendono udibile il modo; cominciare da una nota non è sufficiente.\n\n\u003c/details>\n","html":"\u003ch2>Il modo è una gerarchia\u003c/h2>\n\u003cp>Dire “suona i tasti bianchi da D (Re)” descrive le note di D (Re) dorico, ma non garantisce una musica dorica. Se la frase risolve continuamente su C (Do), potresti sentire ancora C (Do) maggiore. Servono un centro stabile e intervalli caratteristici rispetto a quel centro.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Modo\u003c/th>\n\u003cth>Formula rispetto alla maggiore\u003c/th>\n\u003cth>Grado da mettere a fuoco\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Ionico\u003c/td>\n\u003ctd>1 2 3 4 5 6 7\u003c/td>\n\u003ctd>Terza e settima maggiori\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Dorico\u003c/td>\n\u003ctd>1 2 ♭3 4 5 6 ♭7\u003c/td>\n\u003ctd>Sesta maggiore in ambiente minore\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Frigio\u003c/td>\n\u003ctd>1 ♭2 ♭3 4 5 ♭6 ♭7\u003c/td>\n\u003ctd>Seconda minore\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Lidio\u003c/td>\n\u003ctd>1 2 3 ♯4 5 6 7\u003c/td>\n\u003ctd>Quarta aumentata\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Misolidio\u003c/td>\n\u003ctd>1 2 3 4 5 6 ♭7\u003c/td>\n\u003ctd>Settima minore in ambiente maggiore\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Eolio\u003c/td>\n\u003ctd>1 2 ♭3 4 5 ♭6 ♭7\u003c/td>\n\u003ctd>Sesta e settima minori\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Locrio\u003c/td>\n\u003ctd>1 ♭2 ♭3 4 ♭5 ♭6 ♭7\u003c/td>\n\u003ctd>Quinta diminuita\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2>Tre modi di capire il dorico\u003c/h2>\n\u003cp>\u003cstrong>Ricetta:\u003c/strong> una minore naturale con il sesto grado alzato. \u003cstrong>Confronto parallelo:\u003c/strong> in D (Re) eolio trovi B♭ (Si♭); in D (Re) dorico trovi B (Si). \u003cstrong>Ascolto:\u003c/strong> tieni D (Re) al basso e alterna una frase che tocca il sesto grado nelle due versioni. La differenza emerge senza cambiare tonica.\u003c/p>\n\u003cp>Lavorare sui modi paralleli, cioè con tonica uguale, rende evidenti i colori. Studiare i modi relativi, cioè ricavati dalle stesse note, spiega invece la parentela. Sono due strumenti diversi.\u003c/p>\n\u003ch2>Emozione: una possibilità, non un dizionario\u003c/h2>\n\u003cp>“Maggiore felice, minore triste” può essere una prima associazione culturale, ma non una legge. Registro, andamento, ritmo, timbro, densità, testi e memoria personale possono ribaltare l’effetto. Una scala lidia può apparire aperta con un pad lento oppure tesa con accenti rapidi e distorsione. La quinta diminuita del locrio rende meno stabile la triade sulla tonica; non vieta di costruire un centro modale.\u003c/p>\n\u003ch2>Pentatonica e blues\u003c/h2>\n\u003cp>La pentatonica maggiore usa 1–2–3–5–6; la minore 1–♭3–4–5–♭7. Ridurre le note aiuta a costruire frasi riconoscibili. La scala blues minore aggiunge ♭5; nella pratica blues altezza e intonazione possono essere mobili, non limitate ai dodici tasti.\u003c/p>\n\u003ch2>Prova guidata\u003c/h2>\n\u003cp>Confronta dorico ed eolio sopra lo stesso drone. Canta il sesto grado, quindi inventa una frase di quattro note che vi arrivi e torni alla tonica. Scrivi che cosa senti prima di leggere etichette emotive. Il laboratorio mostra anche il grado caratteristico, non soltanto le note disponibili.\u003c/p>\n\u003cdiv id=\"lab-root\">\u003c/div>\n\n"},{"id":"07-accordi","title":"Costruire e leggere gli accordi","group":2,"lab":"chord","question":"Cadd9 (Do maggiore con nona aggiunta) richiede la settima?","options":["Sì, sempre","No","Solo in registro grave"],"answer":1,"explanation":"Add9 aggiunge la nona alla triade. La sigla 9 senza add implica invece normalmente una settima.","text":"# Costruire e leggere gli accordi\n\n## La triade come pila di terze\nUna triade contiene fondamentale, terza e quinta. La fondamentale dà il nome all’accordo; non deve essere la nota più grave. Da C (Do), una terza maggiore e una quinta giusta producono C (Do), E (Mi), G (Sol): C (Do maggiore). Abbassando la terza ottieni Cm (Do minore): C (Do), E♭ (Mi♭), G (Sol).\n\n| Qualità | Formula | Semitoni dalla fondamentale |\n|---|---|---|\n| Maggiore | 1 3 5 | 0 4 7 |\n| Minore | 1 ♭3 5 | 0 3 7 |\n| Diminuita | 1 ♭3 ♭5 | 0 3 6 |\n| Aumentata | 1 3 ♯5 | 0 4 8 |\n| Sus2 / sus4 | 1 2 5 / 1 4 5 | 0 2 7 / 0 5 7 |\n\nSus sostituisce la terza: l’accordo non dichiara direttamente maggiore o minore. Add aggiunge invece una nota conservando normalmente la terza. **Cadd9 (Do maggiore con nona aggiunta)** contiene C (Do), E (Mi), G (Sol), D (Re), senza richiedere la settima.\n\n## Settime ed estensioni\n**Cmaj7 (Do maggiore settima maggiore):** 0–4–7–11. **C7 (Do settima di dominante):** 0–4–7–10. **Cm7 (Do minore settima):** 0–3–7–10. **Cm7♭5 (Do semidiminuito):** 0–3–6–10. **Cdim7 (Do diminuito settima):** C (Do), E♭ (Mi♭), G♭ (Sol♭), B𝄫 (Si doppio bemolle), semitoni 0–3–6–9. La settima diminuita si scrive con la settima lettera anche se suona come A (La) nel temperamento equabile.\n\nNona, undicesima e tredicesima sono gradi composti. C9 (Do nona di dominante) implica la settima minore; non è sinonimo di Cadd9 (Do maggiore con nona aggiunta). Nei voicing reali puoi omettere la quinta, o delegare la fondamentale al basso; terza e settima spesso chiariscono meglio la qualità.\n\n## Armonizzare una scala\nPrendi una nota sì e una no della scala maggiore, ripetendo da ciascun grado: ottieni I, ii, iii, IV, V, vi, vii°. Maiuscolo indica triade maggiore, minuscolo minore, ° diminuita. In C (Do) maggiore: C (Do maggiore), Dm (Re minore), Em (Mi minore), F (Fa maggiore), G (Sol maggiore), Am (La minore), Bdim (Si diminuito). Non stai imponendo sette accordi casuali: conservi le note della scala.\n\n## Prova guidata\nMantieni la stessa fondamentale e alterna maggiore, minore, sus4 e dominante settima. Ascolta prima l’arpeggio, poi il blocco. Identifica la singola nota responsabile della differenza; guarda i semitoni visualizzati se l’orecchio non la separa ancora.\n\n\u003c!-- LAB:chord | Implementato nell’HTML; vedi laboratori.js. -->\n\n## Verifica\n\nCadd9 (Do maggiore con nona aggiunta) richiede la settima?\n\n1. Sì, sempre\n2. No\n3. Solo in registro grave\n\n\u003cdetails>\u003csummary>Soluzione ragionata\u003c/summary>\n\nAdd9 aggiunge la nona alla triade. La sigla 9 senza add implica invece normalmente una settima.\n\n\u003c/details>\n","html":"\u003ch2>La triade come pila di terze\u003c/h2>\n\u003cp>Una triade contiene fondamentale, terza e quinta. La fondamentale dà il nome all’accordo; non deve essere la nota più grave. Da C (Do), una terza maggiore e una quinta giusta producono C (Do), E (Mi), G (Sol): C (Do maggiore). Abbassando la terza ottieni Cm (Do minore): C (Do), E♭ (Mi♭), G (Sol).\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Qualità\u003c/th>\n\u003cth>Formula\u003c/th>\n\u003cth>Semitoni dalla fondamentale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Maggiore\u003c/td>\n\u003ctd>1 3 5\u003c/td>\n\u003ctd>0 4 7\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Minore\u003c/td>\n\u003ctd>1 ♭3 5\u003c/td>\n\u003ctd>0 3 7\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Diminuita\u003c/td>\n\u003ctd>1 ♭3 ♭5\u003c/td>\n\u003ctd>0 3 6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Aumentata\u003c/td>\n\u003ctd>1 3 ♯5\u003c/td>\n\u003ctd>0 4 8\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sus2 / sus4\u003c/td>\n\u003ctd>1 2 5 / 1 4 5\u003c/td>\n\u003ctd>0 2 7 / 0 5 7\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Sus sostituisce la terza: l’accordo non dichiara direttamente maggiore o minore. Add aggiunge invece una nota conservando normalmente la terza. \u003cstrong>Cadd9 (Do maggiore con nona aggiunta)\u003c/strong> contiene C (Do), E (Mi), G (Sol), D (Re), senza richiedere la settima.\u003c/p>\n\u003ch2>Settime ed estensioni\u003c/h2>\n\u003cp>\u003cstrong>Cmaj7 (Do maggiore settima maggiore):\u003c/strong> 0–4–7–11. \u003cstrong>C7 (Do settima di dominante):\u003c/strong> 0–4–7–10. \u003cstrong>Cm7 (Do minore settima):\u003c/strong> 0–3–7–10. \u003cstrong>Cm7♭5 (Do semidiminuito):\u003c/strong> 0–3–6–10. \u003cstrong>Cdim7 (Do diminuito settima):\u003c/strong> C (Do), E♭ (Mi♭), G♭ (Sol♭), B𝄫 (Si doppio bemolle), semitoni 0–3–6–9. La settima diminuita si scrive con la settima lettera anche se suona come A (La) nel temperamento equabile.\u003c/p>\n\u003cp>Nona, undicesima e tredicesima sono gradi composti. C9 (Do nona di dominante) implica la settima minore; non è sinonimo di Cadd9 (Do maggiore con nona aggiunta). Nei voicing reali puoi omettere la quinta, o delegare la fondamentale al basso; terza e settima spesso chiariscono meglio la qualità.\u003c/p>\n\u003ch2>Armonizzare una scala\u003c/h2>\n\u003cp>Prendi una nota sì e una no della scala maggiore, ripetendo da ciascun grado: ottieni I, ii, iii, IV, V, vi, vii°. Maiuscolo indica triade maggiore, minuscolo minore, ° diminuita. In C (Do) maggiore: C (Do maggiore), Dm (Re minore), Em (Mi minore), F (Fa maggiore), G (Sol maggiore), Am (La minore), Bdim (Si diminuito). Non stai imponendo sette accordi casuali: conservi le note della scala.\u003c/p>\n\u003ch2>Prova guidata\u003c/h2>\n\u003cp>Mantieni la stessa fondamentale e alterna maggiore, minore, sus4 e dominante settima. Ascolta prima l’arpeggio, poi il blocco. Identifica la singola nota responsabile della differenza; guarda i semitoni visualizzati se l’orecchio non la separa ancora.\u003c/p>\n\u003cdiv id=\"lab-root\">\u003c/div>\n\n"},{"id":"08-voci","title":"Rivolti, voicing e collegamento delle voci","group":2,"lab":"voicing","question":"Che cosa determina il rivolto?","options":["La nota più acuta","La nota dell’accordo al basso","Il numero di strumenti"],"answer":1,"explanation":"Il rivolto dipende dal basso. La spaziatura delle altre voci riguarda il voicing.","text":"# Rivolti, voicing e collegamento delle voci\n\n## Identità e disposizione\nL’accordo è l’insieme di relazioni; il **voicing** è il modo concreto di distribuirle per altezza, raddoppi e strumenti. Un **rivolto** riguarda la nota al basso. In C (Do maggiore), C (Do) al basso dà lo stato fondamentale, E (Mi) il primo rivolto, G (Sol) il secondo. Una triade allargata con C (Do) ancora al basso resta in stato fondamentale.\n\n**Posizione stretta:** le voci superiori occupano poco spazio. **Posizione lata:** sono distribuite più ampiamente. Aprire un accordo non significa necessariamente rivoltarlo. Uno slash chord può indicare anche un basso estraneo alla triade: non tutte le sigle con barra sono rivolti.\n\n## Il voice leading in tre immagini\n**Linee:** ogni voce è una piccola melodia; segui dove va ciascuna nota. **Distanze:** cerca note comuni e movimenti brevi. **Conversazione:** lascia ferma una voce mentre un’altra risponde. Il principio utile è rendere intenzionale ogni movimento, non ridurre sempre tutto al minimo.\n\nDa C (Do maggiore), C4 (Do4)–E4 (Mi4)–G4 (Sol4), a F (Fa maggiore), puoi saltare a F4 (Fa4)–A4 (La4)–C5 (Do5), oppure conservare C4 (Do4) e muovere E4 (Mi4)→F4 (Fa4), G4 (Sol4)→A4 (La4). La seconda versione usa F (Fa maggiore) in secondo rivolto. L’armonia nominale resta la stessa, ma il percorso è più vicino.\n\n## Basso, soprano e voci interne\nIl basso suggerisce peso e direzione; la voce più alta emerge facilmente come melodia; quelle interne collegano. Ascolta ciascuna separatamente. In una produzione puoi far suonare la fondamentale a un basso distinto e usare solo terza, settima e nona nel pad. Questo è un voicing senza fondamentale nel pad, non un accordo senza riferimento nell’intero arrangiamento.\n\n## Regole contestuali\nEvitare quinte e ottave parallele è importante in alcuni esercizi di scrittura contrappuntistica, dove si cerca indipendenza delle voci. Non è un divieto generale per musica elettronica o rock. Evita di applicare una regola senza conoscere l’obiettivo stilistico.\n\n## Prova guidata\nAlterna «Blocchi» e «Voci vicine» nella stessa progressione. Il piano roll mostra le traiettorie. Ascolta se la nota più alta crea una linea autonoma; poi abbassa il registro e nota come intervalli stretti possano rendere il basso meno leggibile.\n\n\u003c!-- LAB:voicing | Implementato nell’HTML; vedi laboratori.js. -->\n\n## Verifica\n\nChe cosa determina il rivolto?\n\n1. La nota più acuta\n2. La nota dell’accordo al basso\n3. Il numero di strumenti\n\n\u003cdetails>\u003csummary>Soluzione ragionata\u003c/summary>\n\nIl rivolto dipende dal basso. La spaziatura delle altre voci riguarda il voicing.\n\n\u003c/details>\n","html":"\u003ch2>Identità e disposizione\u003c/h2>\n\u003cp>L’accordo è l’insieme di relazioni; il \u003cstrong>voicing\u003c/strong> è il modo concreto di distribuirle per altezza, raddoppi e strumenti. Un \u003cstrong>rivolto\u003c/strong> riguarda la nota al basso. In C (Do maggiore), C (Do) al basso dà lo stato fondamentale, E (Mi) il primo rivolto, G (Sol) il secondo. Una triade allargata con C (Do) ancora al basso resta in stato fondamentale.\u003c/p>\n\u003cp>\u003cstrong>Posizione stretta:\u003c/strong> le voci superiori occupano poco spazio. \u003cstrong>Posizione lata:\u003c/strong> sono distribuite più ampiamente. Aprire un accordo non significa necessariamente rivoltarlo. Uno slash chord può indicare anche un basso estraneo alla triade: non tutte le sigle con barra sono rivolti.\u003c/p>\n\u003ch2>Il voice leading in tre immagini\u003c/h2>\n\u003cp>\u003cstrong>Linee:\u003c/strong> ogni voce è una piccola melodia; segui dove va ciascuna nota. \u003cstrong>Distanze:\u003c/strong> cerca note comuni e movimenti brevi. \u003cstrong>Conversazione:\u003c/strong> lascia ferma una voce mentre un’altra risponde. Il principio utile è rendere intenzionale ogni movimento, non ridurre sempre tutto al minimo.\u003c/p>\n\u003cp>Da C (Do maggiore), C4 (Do4)–E4 (Mi4)–G4 (Sol4), a F (Fa maggiore), puoi saltare a F4 (Fa4)–A4 (La4)–C5 (Do5), oppure conservare C4 (Do4) e muovere E4 (Mi4)→F4 (Fa4), G4 (Sol4)→A4 (La4). La seconda versione usa F (Fa maggiore) in secondo rivolto. L’armonia nominale resta la stessa, ma il percorso è più vicino.\u003c/p>\n\u003ch2>Basso, soprano e voci interne\u003c/h2>\n\u003cp>Il basso suggerisce peso e direzione; la voce più alta emerge facilmente come melodia; quelle interne collegano. Ascolta ciascuna separatamente. In una produzione puoi far suonare la fondamentale a un basso distinto e usare solo terza, settima e nona nel pad. Questo è un voicing senza fondamentale nel pad, non un accordo senza riferimento nell’intero arrangiamento.\u003c/p>\n\u003ch2>Regole contestuali\u003c/h2>\n\u003cp>Evitare quinte e ottave parallele è importante in alcuni esercizi di scrittura contrappuntistica, dove si cerca indipendenza delle voci. Non è un divieto generale per musica elettronica o rock. Evita di applicare una regola senza conoscere l’obiettivo stilistico.\u003c/p>\n\u003ch2>Prova guidata\u003c/h2>\n\u003cp>Alterna «Blocchi» e «Voci vicine» nella stessa progressione. Il piano roll mostra le traiettorie. Ascolta se la nota più alta crea una linea autonoma; poi abbassa il registro e nota come intervalli stretti possano rendere il basso meno leggibile.\u003c/p>\n\u003cdiv id=\"lab-root\">\u003c/div>\n\n"},{"id":"09-progressioni","title":"Progressioni, funzioni e tensione","group":2,"lab":"progression","question":"Il ritmo armonico misura…","options":["La velocità dei cambi di accordo","La frequenza della fondamentale","Il numero di armoniche"],"answer":0,"explanation":"Il ritmo armonico descrive quanto spesso cambia l’armonia, indipendentemente dal BPM.","text":"# Progressioni, funzioni e tensione\n\n## Gli accordi acquistano significato nel tempo\nUna progressione è una successione di accordi; la funzione descrive il ruolo percepito nel contesto tonale. **Tonica:** stabilità e riferimento. **Predominante:** prepara il movimento. **Dominante:** crea attesa verso la tonica. Nella maggiore, I è il riferimento principale, ii e IV sono frequenti predominanti, V e vii° frequenti dominanti. vi può prolungare o sostituire parte della funzione di tonica, secondo il contesto.\n\nNon tutti i brani seguono questo linguaggio. Loop modali, pedali e armonie statiche possono costruire direzione tramite ritmo, timbro e registro. La funzione non è una proprietà immutabile della sigla isolata.\n\n## Perché V7 tende a I: tre spiegazioni\nIn C (Do) maggiore, G7 (Sol settima di dominante) contiene G (Sol), B (Si), D (Re), F (Fa). **Movimento melodico:** B (Si) tende a C (Do), F (Fa) tende a E (Mi). **Geometria:** il tritono fra B (Si) e F (Fa) si risolve in un intervallo più stabile. **Aspettativa:** l’abitudine al linguaggio tonale rende riconoscibile quel ritorno. Fisica e apprendimento contribuiscono, ma non producono un obbligo universale.\n\n## Quattro modi di terminare\n| Cadenza | Movimento tipico | Effetto nel linguaggio tonale |\n|---|---|---|\n| Autentica | V–I | Arrivo; forza variabile con basso e melodia |\n| Plagale | IV–I | Rientro senza dominante |\n| Sospesa | Fine su V | Frase aperta |\n| D’inganno | V–vi in maggiore | Risoluzione attesa deviata |\n\nUna cadenza autentica perfetta richiede condizioni più precise, fra cui V e I in stato fondamentale e tonica al soprano sull’arrivo. Non ogni V–I è “perfetta”.\n\n## Minore e ritmo armonico\nIn minore naturale il quinto accordo è minore. Alzando il settimo grado della scala compare una dominante maggiore: in A (La) minore, E7 (Mi settima di dominante) usa G♯ (Sol♯) e conduce ad Am (La minore). Il **ritmo armonico** è la frequenza dei cambi d’accordo: un accordo per battuta o due per battuta cambia l’urgenza anche a BPM identico.\n\n## Prova guidata\nAscolta I–V–vi–IV e ii–V–I con gli stessi suoni. Ferma mentalmente la sequenza prima dell’ultimo accordo e canta l’arrivo. Poi allunga ogni accordo: cambia l’attesa senza cambiare né tonalità né intervalli.\n\n\u003c!-- LAB:progression | Implementato nell’HTML; vedi laboratori.js. -->\n\n## Verifica\n\nIl ritmo armonico misura…\n\n1. La velocità dei cambi di accordo\n2. La frequenza della fondamentale\n3. Il numero di armoniche\n\n\u003cdetails>\u003csummary>Soluzione ragionata\u003c/summary>\n\nIl ritmo armonico descrive quanto spesso cambia l’armonia, indipendentemente dal BPM.\n\n\u003c/details>\n","html":"\u003ch2>Gli accordi acquistano significato nel tempo\u003c/h2>\n\u003cp>Una progressione è una successione di accordi; la funzione descrive il ruolo percepito nel contesto tonale. \u003cstrong>Tonica:\u003c/strong> stabilità e riferimento. \u003cstrong>Predominante:\u003c/strong> prepara il movimento. \u003cstrong>Dominante:\u003c/strong> crea attesa verso la tonica. Nella maggiore, I è il riferimento principale, ii e IV sono frequenti predominanti, V e vii° frequenti dominanti. vi può prolungare o sostituire parte della funzione di tonica, secondo il contesto.\u003c/p>\n\u003cp>Non tutti i brani seguono questo linguaggio. Loop modali, pedali e armonie statiche possono costruire direzione tramite ritmo, timbro e registro. La funzione non è una proprietà immutabile della sigla isolata.\u003c/p>\n\u003ch2>Perché V7 tende a I: tre spiegazioni\u003c/h2>\n\u003cp>In C (Do) maggiore, G7 (Sol settima di dominante) contiene G (Sol), B (Si), D (Re), F (Fa). \u003cstrong>Movimento melodico:\u003c/strong> B (Si) tende a C (Do), F (Fa) tende a E (Mi). \u003cstrong>Geometria:\u003c/strong> il tritono fra B (Si) e F (Fa) si risolve in un intervallo più stabile. \u003cstrong>Aspettativa:\u003c/strong> l’abitudine al linguaggio tonale rende riconoscibile quel ritorno. Fisica e apprendimento contribuiscono, ma non producono un obbligo universale.\u003c/p>\n\u003ch2>Quattro modi di terminare\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Cadenza\u003c/th>\n\u003cth>Movimento tipico\u003c/th>\n\u003cth>Effetto nel linguaggio tonale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Autentica\u003c/td>\n\u003ctd>V–I\u003c/td>\n\u003ctd>Arrivo; forza variabile con basso e melodia\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Plagale\u003c/td>\n\u003ctd>IV–I\u003c/td>\n\u003ctd>Rientro senza dominante\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sospesa\u003c/td>\n\u003ctd>Fine su V\u003c/td>\n\u003ctd>Frase aperta\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D’inganno\u003c/td>\n\u003ctd>V–vi in maggiore\u003c/td>\n\u003ctd>Risoluzione attesa deviata\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Una cadenza autentica perfetta richiede condizioni più precise, fra cui V e I in stato fondamentale e tonica al soprano sull’arrivo. Non ogni V–I è “perfetta”.\u003c/p>\n\u003ch2>Minore e ritmo armonico\u003c/h2>\n\u003cp>In minore naturale il quinto accordo è minore. Alzando il settimo grado della scala compare una dominante maggiore: in A (La) minore, E7 (Mi settima di dominante) usa G♯ (Sol♯) e conduce ad Am (La minore). Il \u003cstrong>ritmo armonico\u003c/strong> è la frequenza dei cambi d’accordo: un accordo per battuta o due per battuta cambia l’urgenza anche a BPM identico.\u003c/p>\n\u003ch2>Prova guidata\u003c/h2>\n\u003cp>Ascolta I–V–vi–IV e ii–V–I con gli stessi suoni. Ferma mentalmente la sequenza prima dell’ultimo accordo e canta l’arrivo. Poi allunga ogni accordo: cambia l’attesa senza cambiare né tonalità né intervalli.\u003c/p>\n\u003cdiv id=\"lab-root\">\u003c/div>\n\n"},{"id":"10-cromatismo","title":"Prestiti, dominanti secondarie e modulazione","group":2,"lab":"chromatic","question":"D7 (Re settima di dominante) in C (Do) maggiore può essere…","options":["V/V, senza modulazione obbligatoria","Sempre la nuova tonica","Un accordo diatonico della scala maggiore iniziale"],"answer":0,"explanation":"È una dominante secondaria diretta verso G (Sol maggiore); il contesto decide se il nuovo centro si stabilisce.","text":"# Prestiti, dominanti secondarie e modulazione\n\n## Uscire dalla scala con una ragione\nCromatico significa introdurre note esterne alla collezione di riferimento. Questo non implica automaticamente cambiare tonalità. Una nota di passaggio, una dominante secondaria e una nuova tonica sono fenomeni diversi.\n\nUna **dominante secondaria** tratta momentaneamente un accordo come destinazione. In C (Do) maggiore, D7 (Re settima di dominante) contiene F♯ (Fa♯), estraneo alla scala, e porta a G (Sol maggiore). Si scrive V7/V: dominante della dominante. Se subito dopo G (Sol maggiore) torna a C (Do maggiore), il centro globale può restare C (Do).\n\n## Tonicizzazione e modulazione in tre modi\n**Durata:** una tonicizzazione è una focalizzazione locale; una modulazione stabilisce un altro centro per un tratto significativo. **Conferma:** cadenze, melodia e basso sostengono la nuova tonalità. **Analogia:** illuminare per un momento un’altra stanza non equivale a trasferirsi lì. Non esiste un numero fisso di battute che decida da solo.\n\nPer passare da C (Do) maggiore a G (Sol) maggiore, Am (La minore) può funzionare come accordo comune: vi nella prima tonalità, ii nella seconda. Proseguire con D7 (Re settima di dominante) e G (Sol maggiore), ribadendo il nuovo centro, rende il passaggio riconoscibile. Un accordo comune è un possibile ponte, non un requisito.\n\n## Prestito modale\nPrendere un accordo dalla tonalità parallela conserva il riferimento alla tonica ma cambia il colore. In C (Do) maggiore puoi usare Fm (Fa minore), iv preso da C (Do) minore, prima di C (Do maggiore). La nota A♭ (La♭) scende a G (Sol): un movimento concreto spiega il risultato meglio dell’etichetta “malinconico”. Anche ♭VI e ♭VII sono prestiti frequenti in vari stili.\n\n## Cosa evitare\nNon chiamare modulazione qualsiasi nota fuori scala. Non cercare una scala nuova per ogni accordo prima di ascoltare le linee comuni. Un cromatismo può essere compreso come semplice movimento di una voce; troppe etichette possono nascondere questa continuità.\n\n## Prova guidata\nConfronta I–IV–I con I–iv–I; poi ascolta I–V/V–V–I. Nel primo caso cambia il colore della predominante, nel secondo aumenta la direzione verso la dominante. Scrivi la nota estranea e la sua risoluzione prima di cambiare tonalità nel tuo progetto.\n\n\u003c!-- LAB:chromatic | Implementato nell’HTML; vedi laboratori.js. -->\n\n## Verifica\n\nD7 (Re settima di dominante) in C (Do) maggiore può essere…\n\n1. V/V, senza modulazione obbligatoria\n2. Sempre la nuova tonica\n3. Un accordo diatonico della scala maggiore iniziale\n\n\u003cdetails>\u003csummary>Soluzione ragionata\u003c/summary>\n\nÈ una dominante secondaria diretta verso G (Sol maggiore); il contesto decide se il nuovo centro si stabilisce.\n\n\u003c/details>\n","html":"\u003ch2>Uscire dalla scala con una ragione\u003c/h2>\n\u003cp>Cromatico significa introdurre note esterne alla collezione di riferimento. Questo non implica automaticamente cambiare tonalità. Una nota di passaggio, una dominante secondaria e una nuova tonica sono fenomeni diversi.\u003c/p>\n\u003cp>Una \u003cstrong>dominante secondaria\u003c/strong> tratta momentaneamente un accordo come destinazione. In C (Do) maggiore, D7 (Re settima di dominante) contiene F♯ (Fa♯), estraneo alla scala, e porta a G (Sol maggiore). Si scrive V7/V: dominante della dominante. Se subito dopo G (Sol maggiore) torna a C (Do maggiore), il centro globale può restare C (Do).\u003c/p>\n\u003ch2>Tonicizzazione e modulazione in tre modi\u003c/h2>\n\u003cp>\u003cstrong>Durata:\u003c/strong> una tonicizzazione è una focalizzazione locale; una modulazione stabilisce un altro centro per un tratto significativo. \u003cstrong>Conferma:\u003c/strong> cadenze, melodia e basso sostengono la nuova tonalità. \u003cstrong>Analogia:\u003c/strong> illuminare per un momento un’altra stanza non equivale a trasferirsi lì. Non esiste un numero fisso di battute che decida da solo.\u003c/p>\n\u003cp>Per passare da C (Do) maggiore a G (Sol) maggiore, Am (La minore) può funzionare come accordo comune: vi nella prima tonalità, ii nella seconda. Proseguire con D7 (Re settima di dominante) e G (Sol maggiore), ribadendo il nuovo centro, rende il passaggio riconoscibile. Un accordo comune è un possibile ponte, non un requisito.\u003c/p>\n\u003ch2>Prestito modale\u003c/h2>\n\u003cp>Prendere un accordo dalla tonalità parallela conserva il riferimento alla tonica ma cambia il colore. In C (Do) maggiore puoi usare Fm (Fa minore), iv preso da C (Do) minore, prima di C (Do maggiore). La nota A♭ (La♭) scende a G (Sol): un movimento concreto spiega il risultato meglio dell’etichetta “malinconico”. Anche ♭VI e ♭VII sono prestiti frequenti in vari stili.\u003c/p>\n\u003ch2>Cosa evitare\u003c/h2>\n\u003cp>Non chiamare modulazione qualsiasi nota fuori scala. Non cercare una scala nuova per ogni accordo prima di ascoltare le linee comuni. Un cromatismo può essere compreso come semplice movimento di una voce; troppe etichette possono nascondere questa continuità.\u003c/p>\n\u003ch2>Prova guidata\u003c/h2>\n\u003cp>Confronta I–IV–I con I–iv–I; poi ascolta I–V/V–V–I. Nel primo caso cambia il colore della predominante, nel secondo aumenta la direzione verso la dominante. Scrivi la nota estranea e la sua risoluzione prima di cambiare tonalità nel tuo progetto.\u003c/p>\n\u003cdiv id=\"lab-root\">\u003c/div>\n\n"},{"id":"11-melodia","title":"Melodia, motivi e note estranee","group":2,"lab":"melody","question":"Una nota della scala è sempre una nota dell’accordo corrente?","options":["Sì","No","Solo a tempo lento"],"answer":1,"explanation":"La scala contiene più note della triade: una nota può essere diatonica e tuttavia estranea all’accordo corrente.","text":"# Melodia, motivi e note estranee\n\n## Una frase è più di una scala\nUna melodia organizza altezze, durate, accenti, ripetizioni e pause. Un **motivo** è una piccola idea riconoscibile; una **frase** dà un senso di percorso e articolazione. La stessa sequenza di tre note può assumere caratteri molto diversi cambiando le durate.\n\nParti da C (Do), D (Re), E (Mi) sopra C (Do maggiore). C (Do) ed E (Mi) appartengono alla triade, D (Re) collega. Se D (Re) è breve fra le altre due, è una nota di passaggio; se è lunga e accentata, il suo peso cambia. La distinzione non è soltanto “nella scala” o “fuori scala”: conta la relazione con l’accordo in quel momento.\n\n## Quattro gesti melodici\n**Passaggio:** collega due note per grado congiunto. **Volta:** si allontana da una nota e vi ritorna, come E (Mi)–F (Fa)–E (Mi). **Anticipazione:** introduce in anticipo una nota dell’accordo seguente. **Ritardo:** una nota preparata resta mentre l’armonia cambia, poi risolve, spesso scendendo per grado. “Ritardo” qui non è un effetto delay.\n\nUn’appoggiatura mette in rilievo una nota non appartenente all’accordo che poi risolve; la preparazione e l’accento la distinguono da altre figure. Queste categorie descrivono comportamenti tipici, non vietano di tenere una tensione senza risolverla.\n\n## Sviluppare senza perdere identità\nRipeti un motivo e cambia un solo aspetto: trasponi, modifica l’ultima nota, raddoppia le durate, sposta l’accento, inserisci una pausa. Una sequenza ripete un disegno a diverse altezze. Il contorno descrive salita, discesa e punti culminanti; una buona frase non deve riempire tutti gli spazi.\n\n## Melodia e basso come telaio\nAscolta solo queste due parti: comunicano già direzione? Se sì, inserisci accordi senza soffocare il tema. Se tutte le parti si muovono molto, stabilizza almeno una voce. In una frase con un salto ampio puoi sperimentare un ritorno per gradi: è una strategia di equilibrio, non un obbligo.\n\n## Prova guidata\nNel laboratorio confronta la frase solo con note dell’accordo e la versione con passaggi. Mantieni basso e durata uguali. Poi cambia il ritmo del motivo. Individua la nota più lunga e chiediti se è anche quella che vuoi mettere al centro.\n\n\u003c!-- LAB:melody | Implementato nell’HTML; vedi laboratori.js. -->\n\n## Verifica\n\nUna nota della scala è sempre una nota dell’accordo corrente?\n\n1. Sì\n2. No\n3. Solo a tempo lento\n\n\u003cdetails>\u003csummary>Soluzione ragionata\u003c/summary>\n\nLa scala contiene più note della triade: una nota può essere diatonica e tuttavia estranea all’accordo corrente.\n\n\u003c/details>\n","html":"\u003ch2>Una frase è più di una scala\u003c/h2>\n\u003cp>Una melodia organizza altezze, durate, accenti, ripetizioni e pause. Un \u003cstrong>motivo\u003c/strong> è una piccola idea riconoscibile; una \u003cstrong>frase\u003c/strong> dà un senso di percorso e articolazione. La stessa sequenza di tre note può assumere caratteri molto diversi cambiando le durate.\u003c/p>\n\u003cp>Parti da C (Do), D (Re), E (Mi) sopra C (Do maggiore). C (Do) ed E (Mi) appartengono alla triade, D (Re) collega. Se D (Re) è breve fra le altre due, è una nota di passaggio; se è lunga e accentata, il suo peso cambia. La distinzione non è soltanto “nella scala” o “fuori scala”: conta la relazione con l’accordo in quel momento.\u003c/p>\n\u003ch2>Quattro gesti melodici\u003c/h2>\n\u003cp>\u003cstrong>Passaggio:\u003c/strong> collega due note per grado congiunto. \u003cstrong>Volta:\u003c/strong> si allontana da una nota e vi ritorna, come E (Mi)–F (Fa)–E (Mi). \u003cstrong>Anticipazione:\u003c/strong> introduce in anticipo una nota dell’accordo seguente. \u003cstrong>Ritardo:\u003c/strong> una nota preparata resta mentre l’armonia cambia, poi risolve, spesso scendendo per grado. “Ritardo” qui non è un effetto delay.\u003c/p>\n\u003cp>Un’appoggiatura mette in rilievo una nota non appartenente all’accordo che poi risolve; la preparazione e l’accento la distinguono da altre figure. Queste categorie descrivono comportamenti tipici, non vietano di tenere una tensione senza risolverla.\u003c/p>\n\u003ch2>Sviluppare senza perdere identità\u003c/h2>\n\u003cp>Ripeti un motivo e cambia un solo aspetto: trasponi, modifica l’ultima nota, raddoppia le durate, sposta l’accento, inserisci una pausa. Una sequenza ripete un disegno a diverse altezze. Il contorno descrive salita, discesa e punti culminanti; una buona frase non deve riempire tutti gli spazi.\u003c/p>\n\u003ch2>Melodia e basso come telaio\u003c/h2>\n\u003cp>Ascolta solo queste due parti: comunicano già direzione? Se sì, inserisci accordi senza soffocare il tema. Se tutte le parti si muovono molto, stabilizza almeno una voce. In una frase con un salto ampio puoi sperimentare un ritorno per gradi: è una strategia di equilibrio, non un obbligo.\u003c/p>\n\u003ch2>Prova guidata\u003c/h2>\n\u003cp>Nel laboratorio confronta la frase solo con note dell’accordo e la versione con passaggi. Mantieni basso e durata uguali. Poi cambia il ritmo del motivo. Individua la nota più lunga e chiediti se è anche quella che vuoi mettere al centro.\u003c/p>\n\u003cdiv id=\"lab-root\">\u003c/div>\n\n"},{"id":"12-orecchio","title":"Ear training: riconoscere e prevedere","group":2,"lab":"ear","question":"Quale esercizio allena una previsione sonora?","options":["Leggere subito la risposta","Cantare l’arrivo prima di ascoltarlo","Usare sempre la stessa fondamentale"],"answer":1,"explanation":"Prevedere e poi verificare costruisce una relazione interna fra intervallo e suono.","text":"# Ear training: riconoscere e prevedere\n\n## L’orecchio si allena per relazioni\nL’orecchio relativo riconosce distanze e funzioni rispetto a un riferimento. Non richiede orecchio assoluto. Cantare una nota prima di sentirla è più utile che indovinare etichette a caso: mette alla prova una previsione interna.\n\n## Una sessione di dieci minuti\nAscolta la tonica e cantala. Confronta due intervalli vicini, per esempio terza minore e maggiore, evitando inizialmente dodici possibilità. Ascolta prima in successione, poi simultaneamente. Cambia la fondamentale per non associare una risposta a una sola nota. Ripeti l’errore lentamente e descrivi in che cosa differiva dalla previsione.\n\nPassa poi alle triadi maggiore, minore, diminuita e aumentata. Canta fondamentale, terza e quinta separatamente; infine ascolta l’accordo senza scomporlo. Le associazioni con canzoni possono aiutare all’inizio, ma dipendono da direzione, registro e contesto. Non sostituiscono la relazione intervallare.\n\n## Tre livelli di riconoscimento\n**Isolato:** riconosco sette semitoni. **Tonale:** sento il quinto grado rispetto alla tonica. **Musicale:** riconosco il ruolo di quella nota in una frase. Sono abilità complementari. Un test su due sinusoidi non misura tutto il tuo orecchio musicale.\n\n## Trascrivere piccole unità\nScegli un frammento di due secondi. Batti il ritmo senza altezze, cerca la nota di arrivo, quindi ricostruisci gli intervalli. Controlla su uno strumento solo dopo il tentativo. Se il timbro confonde, prova a cantare la linea; se la velocità confonde, rallenta senza alterare l’intonazione.\n\n## Prova guidata\nIl laboratorio genera intervalli ascendenti casuali e nasconde la soluzione finché rispondi. Ripeti lo stesso esempio senza cambiarlo, poi scegline uno nuovo. Il feedback indica anche il numero di semitoni. Annota quali coppie confondi: il prossimo esercizio deve concentrarsi su quelle, non sui risultati già facili.\n\n## Trasferimento alla produzione\nQuando un accordo “non funziona”, canta prima il basso e la melodia. Individua se il problema è una nota, il registro, il ritmo o il timbro. Un filtro non corregge una relazione armonica che non volevi; allo stesso modo una nota teoricamente corretta può essere poco leggibile con un suono troppo denso.\n\n\u003c!-- LAB:ear | Implementato nell’HTML; vedi laboratori.js. -->\n\n## Verifica\n\nQuale esercizio allena una previsione sonora?\n\n1. Leggere subito la risposta\n2. Cantare l’arrivo prima di ascoltarlo\n3. Usare sempre la stessa fondamentale\n\n\u003cdetails>\u003csummary>Soluzione ragionata\u003c/summary>\n\nPrevedere e poi verificare costruisce una relazione interna fra intervallo e suono.\n\n\u003c/details>\n","html":"\u003ch2>L’orecchio si allena per relazioni\u003c/h2>\n\u003cp>L’orecchio relativo riconosce distanze e funzioni rispetto a un riferimento. Non richiede orecchio assoluto. Cantare una nota prima di sentirla è più utile che indovinare etichette a caso: mette alla prova una previsione interna.\u003c/p>\n\u003ch2>Una sessione di dieci minuti\u003c/h2>\n\u003cp>Ascolta la tonica e cantala. Confronta due intervalli vicini, per esempio terza minore e maggiore, evitando inizialmente dodici possibilità. Ascolta prima in successione, poi simultaneamente. Cambia la fondamentale per non associare una risposta a una sola nota. Ripeti l’errore lentamente e descrivi in che cosa differiva dalla previsione.\u003c/p>\n\u003cp>Passa poi alle triadi maggiore, minore, diminuita e aumentata. Canta fondamentale, terza e quinta separatamente; infine ascolta l’accordo senza scomporlo. Le associazioni con canzoni possono aiutare all’inizio, ma dipendono da direzione, registro e contesto. Non sostituiscono la relazione intervallare.\u003c/p>\n\u003ch2>Tre livelli di riconoscimento\u003c/h2>\n\u003cp>\u003cstrong>Isolato:\u003c/strong> riconosco sette semitoni. \u003cstrong>Tonale:\u003c/strong> sento il quinto grado rispetto alla tonica. \u003cstrong>Musicale:\u003c/strong> riconosco il ruolo di quella nota in una frase. Sono abilità complementari. Un test su due sinusoidi non misura tutto il tuo orecchio musicale.\u003c/p>\n\u003ch2>Trascrivere piccole unità\u003c/h2>\n\u003cp>Scegli un frammento di due secondi. Batti il ritmo senza altezze, cerca la nota di arrivo, quindi ricostruisci gli intervalli. Controlla su uno strumento solo dopo il tentativo. Se il timbro confonde, prova a cantare la linea; se la velocità confonde, rallenta senza alterare l’intonazione.\u003c/p>\n\u003ch2>Prova guidata\u003c/h2>\n\u003cp>Il laboratorio genera intervalli ascendenti casuali e nasconde la soluzione finché rispondi. Ripeti lo stesso esempio senza cambiarlo, poi scegline uno nuovo. Il feedback indica anche il numero di semitoni. Annota quali coppie confondi: il prossimo esercizio deve concentrarsi su quelle, non sui risultati già facili.\u003c/p>\n\u003ch2>Trasferimento alla produzione\u003c/h2>\n\u003cp>Quando un accordo “non funziona”, canta prima il basso e la melodia. Individua se il problema è una nota, il registro, il ritmo o il timbro. Un filtro non corregge una relazione armonica che non volevi; allo stesso modo una nota teoricamente corretta può essere poco leggibile con un suono troppo denso.\u003c/p>\n\u003cdiv id=\"lab-root\">\u003c/div>\n\n"},{"id":"13-arrangiamento","title":"Arrangiamento: registro, densità e spazio","group":3,"lab":"arrangement","question":"Due strumenti con fondamentali diverse possono mascherarsi?","options":["No","Sì, le loro componenti spettrali possono sovrapporsi","Solo se sono identici"],"answer":1,"explanation":"La fondamentale è solo una parte del suono: armoniche, rumore e transitori possono sovrapporsi.","text":"# Arrangiamento: registro, densità e spazio\n\n## Prima i ruoli, poi le frequenze\nArrangiare significa scegliere chi suona che cosa, quando e in quale registro. Melodia, basso, armonia, impulso ritmico e texture sono ruoli; uno strumento può coprirne più di uno. La chiarezza nasce anche dall’alternanza nel tempo, non solo dall’equalizzazione.\n\nUna nota non occupa una singola frequenza. C2 (Do2) ha fondamentale circa 65,4 Hz, ma una sega sulla stessa nota estende armoniche nei medi e negli acuti. Due strumenti con fondamentali lontane possono comunque mascherarsi. Per questo una mappa di registri è una guida compositiva, non uno spettrogramma del mix.\n\n## Perché aprire gli accordi nel grave\n**Musicalmente:** lasciare una fondamentale e una quinta al basso rende più distinguibili le funzioni. **Spettralmente:** le armoniche di note ravvicinate si sovrappongono in regioni sensibili e possono produrre battimenti e ruvidità. **Praticamente:** sposta terza e settima un’ottava sopra prima di tagliare con un EQ. La soglia dipende dal timbro, dal livello e dall’obiettivo estetico; non esiste un confine universale.\n\n## Quattro dimensioni utili\n| Dimensione | Domanda | Intervento musicale |\n|---|---|---|\n| Registro | Chi occupa il grave? | Sposta o ometti un raddoppio |\n| Tempo | Chi parla insieme al tema? | Introduci risposte e pause |\n| Articolazione | Le code si accumulano? | Accorcia gate o release |\n| Timbro | Tutti hanno transitori e armoniche simili? | Scegli materiali complementari |\n\nPanorama e profondità completano il quadro, ma il controllo mono rivela se la separazione dipende soltanto dallo stereo. Il sidechain può liberare spazio temporaneo; non rende automaticamente ben scritto un arrangiamento troppo fitto.\n\n## Un caso concreto\nBasso: C2 (Do2). Pad: C3 (Do3)–E3 (Mi3)–G3 (Sol3). Melodia: E4 (Mi4). Prima prova a togliere C3 (Do3) dal pad: il basso comunica già la fondamentale. Poi porta E3 (Mi3) a E4 (Mi4), verificando se entra in conflitto con il tema. Non c’è una soluzione unica: scegli quale parte deve emergere.\n\n## Prova guidata\nConfronta l’accordo compatto nel grave con quello aperto nel laboratorio. Il grafico indica le altezze delle voci, non bande di frequenza esclusive. Cambia il registro e ascolta come la stessa qualità armonica possa diventare impastata oppure trasparente.\n\n\u003c!-- LAB:arrangement | Implementato nell’HTML; vedi laboratori.js. -->\n\n## Verifica\n\nDue strumenti con fondamentali diverse possono mascherarsi?\n\n1. No\n2. Sì, le loro componenti spettrali possono sovrapporsi\n3. Solo se sono identici\n\n\u003cdetails>\u003csummary>Soluzione ragionata\u003c/summary>\n\nLa fondamentale è solo una parte del suono: armoniche, rumore e transitori possono sovrapporsi.\n\n\u003c/details>\n","html":"\u003ch2>Prima i ruoli, poi le frequenze\u003c/h2>\n\u003cp>Arrangiare significa scegliere chi suona che cosa, quando e in quale registro. Melodia, basso, armonia, impulso ritmico e texture sono ruoli; uno strumento può coprirne più di uno. La chiarezza nasce anche dall’alternanza nel tempo, non solo dall’equalizzazione.\u003c/p>\n\u003cp>Una nota non occupa una singola frequenza. C2 (Do2) ha fondamentale circa 65,4 Hz, ma una sega sulla stessa nota estende armoniche nei medi e negli acuti. Due strumenti con fondamentali lontane possono comunque mascherarsi. Per questo una mappa di registri è una guida compositiva, non uno spettrogramma del mix.\u003c/p>\n\u003ch2>Perché aprire gli accordi nel grave\u003c/h2>\n\u003cp>\u003cstrong>Musicalmente:\u003c/strong> lasciare una fondamentale e una quinta al basso rende più distinguibili le funzioni. \u003cstrong>Spettralmente:\u003c/strong> le armoniche di note ravvicinate si sovrappongono in regioni sensibili e possono produrre battimenti e ruvidità. \u003cstrong>Praticamente:\u003c/strong> sposta terza e settima un’ottava sopra prima di tagliare con un EQ. La soglia dipende dal timbro, dal livello e dall’obiettivo estetico; non esiste un confine universale.\u003c/p>\n\u003ch2>Quattro dimensioni utili\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Dimensione\u003c/th>\n\u003cth>Domanda\u003c/th>\n\u003cth>Intervento musicale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Registro\u003c/td>\n\u003ctd>Chi occupa il grave?\u003c/td>\n\u003ctd>Sposta o ometti un raddoppio\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tempo\u003c/td>\n\u003ctd>Chi parla insieme al tema?\u003c/td>\n\u003ctd>Introduci risposte e pause\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Articolazione\u003c/td>\n\u003ctd>Le code si accum
