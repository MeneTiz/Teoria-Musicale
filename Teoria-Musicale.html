ulano?\u003c/td>\n\u003ctd>Accorcia gate o release\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Timbro\u003c/td>\n\u003ctd>Tutti hanno transitori e armoniche simili?\u003c/td>\n\u003ctd>Scegli materiali complementari\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Panorama e profondità completano il quadro, ma il controllo mono rivela se la separazione dipende soltanto dallo stereo. Il sidechain può liberare spazio temporaneo; non rende automaticamente ben scritto un arrangiamento troppo fitto.\u003c/p>\n\u003ch2>Un caso concreto\u003c/h2>\n\u003cp>Basso: C2 (Do2). Pad: C3 (Do3)–E3 (Mi3)–G3 (Sol3). Melodia: E4 (Mi4). Prima prova a togliere C3 (Do3) dal pad: il basso comunica già la fondamentale. Poi porta E3 (Mi3) a E4 (Mi4), verificando se entra in conflitto con il tema. Non c’è una soluzione unica: scegli quale parte deve emergere.\u003c/p>\n\u003ch2>Prova guidata\u003c/h2>\n\u003cp>Confronta l’accordo compatto nel grave con quello aperto nel laboratorio. Il grafico indica le altezze delle voci, non bande di frequenza esclusive. Cambia il registro e ascolta come la stessa qualità armonica possa diventare impastata oppure trasparente.\u003c/p>\n\u003cdiv id=\"lab-root\">\u003c/div>\n\n"},{"id":"14-forma","title":"Struttura del brano e dinamica armonica","group":3,"lab":"form","question":"Un aumento della tensione richiede più volume?","options":["Sì","No, può derivare da armonia, ritmo o attesa","Solo nel ritornello"],"answer":1,"explanation":"La dinamica formale comprende più variabili: tensione e livello sonoro non coincidono.","text":"# Struttura del brano e dinamica armonica\n\n## La forma organizza memoria e novità\nUna sezione si riconosce da ciò che resta stabile e da ciò che cambia. Intro, strofa, ritornello, bridge, breakdown e drop sono funzioni frequenti, non caselle obbligatorie. Forme come AB, ABA e strofa–ritornello descrivono relazioni di ripetizione e contrasto, senza fissare genere o durata.\n\nUna frase di quattro battute può essere ripetuta con una variazione; due frasi possono produrre domanda e risposta. Le unità di 4, 8 o 16 battute sono comuni in molte produzioni, ma un’aggiunta o una sottrazione intenzionale crea sorpresa. Prima fai sentire la regolarità, poi valuta quanto romperla.\n\n## Tre tipi di energia indipendenti\n**Ritmica:** densità e velocità degli eventi. **Armonica:** frequenza dei cambi, distanza dal centro, grado di risoluzione. **Spettrale e dinamica:** registro, brillantezza e livello. Puoi avere un punto molto teso e molto silenzioso. Un ritornello può crescere aprendo le voci e allargando il registro senza alzare il fader.\n\n## Il ritmo armonico come acceleratore\nPrendi I–V–vi–IV. Nella prima sezione tieni ogni accordo due battute, nella seconda una battuta, nella transizione mezzo giro di battuta. Il BPM non cambia; cambia la frequenza delle decisioni armoniche. Aumentare tutto contemporaneamente produce spesso un crescendo indistinto: scegli un parametro principale.\n\n## Progettare 16 battute\n| Battute | Funzione | Scelta |\n|---|---|---|\n| 1–4 | Presentazione | Motivo breve, registro medio |\n| 5–8 | Conferma | Stesso motivo, finale variato |\n| 9–12 | Contrasto | Meno percussioni, accordi più lunghi |\n| 13–16 | Ritorno | Motivo completo, cadenza riconoscibile |\n\nIl ritorno funziona se la prima idea era memorizzabile. Un fill può annunciare il confine; una pausa prima dell’arrivo può renderlo più forte. Non occorre introdurre sempre un nuovo strumento.\n\n## Prova guidata\nNel laboratorio cambia il profilo di densità delle quattro sezioni e ascolta l’anteprima ridotta. Il disegno mostra un indice didattico di attività, non LUFS o una previsione emotiva. Ricrea poi lo schema in 16 battute vere: ogni blocco dell’anteprima rappresenta una sezione, non la sua durata completa.\n\n\u003c!-- LAB:form | Implementato nell’HTML; vedi laboratori.js. -->\n\n## Verifica\n\nUn aumento della tensione richiede più volume?\n\n1. Sì\n2. No, può derivare da armonia, ritmo o attesa\n3. Solo nel ritornello\n\n\u003cdetails>\u003csummary>Soluzione ragionata\u003c/summary>\n\nLa dinamica formale comprende più variabili: tensione e livello sonoro non coincidono.\n\n\u003c/details>\n","html":"\u003ch2>La forma organizza memoria e novità\u003c/h2>\n\u003cp>Una sezione si riconosce da ciò che resta stabile e da ciò che cambia. Intro, strofa, ritornello, bridge, breakdown e drop sono funzioni frequenti, non caselle obbligatorie. Forme come AB, ABA e strofa–ritornello descrivono relazioni di ripetizione e contrasto, senza fissare genere o durata.\u003c/p>\n\u003cp>Una frase di quattro battute può essere ripetuta con una variazione; due frasi possono produrre domanda e risposta. Le unità di 4, 8 o 16 battute sono comuni in molte produzioni, ma un’aggiunta o una sottrazione intenzionale crea sorpresa. Prima fai sentire la regolarità, poi valuta quanto romperla.\u003c/p>\n\u003ch2>Tre tipi di energia indipendenti\u003c/h2>\n\u003cp>\u003cstrong>Ritmica:\u003c/strong> densità e velocità degli eventi. \u003cstrong>Armonica:\u003c/strong> frequenza dei cambi, distanza dal centro, grado di risoluzione. \u003cstrong>Spettrale e dinamica:\u003c/strong> registro, brillantezza e livello. Puoi avere un punto molto teso e molto silenzioso. Un ritornello può crescere aprendo le voci e allargando il registro senza alzare il fader.\u003c/p>\n\u003ch2>Il ritmo armonico come acceleratore\u003c/h2>\n\u003cp>Prendi I–V–vi–IV. Nella prima sezione tieni ogni accordo due battute, nella seconda una battuta, nella transizione mezzo giro di battuta. Il BPM non cambia; cambia la frequenza delle decisioni armoniche. Aumentare tutto contemporaneamente produce spesso un crescendo indistinto: scegli un parametro principale.\u003c/p>\n\u003ch2>Progettare 16 battute\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Battute\u003c/th>\n\u003cth>Funzione\u003c/th>\n\u003cth>Scelta\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1–4\u003c/td>\n\u003ctd>Presentazione\u003c/td>\n\u003ctd>Motivo breve, registro medio\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5–8\u003c/td>\n\u003ctd>Conferma\u003c/td>\n\u003ctd>Stesso motivo, finale variato\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>9–12\u003c/td>\n\u003ctd>Contrasto\u003c/td>\n\u003ctd>Meno percussioni, accordi più lunghi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>13–16\u003c/td>\n\u003ctd>Ritorno\u003c/td>\n\u003ctd>Motivo completo, cadenza riconoscibile\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Il ritorno funziona se la prima idea era memorizzabile. Un fill può annunciare il confine; una pausa prima dell’arrivo può renderlo più forte. Non occorre introdurre sempre un nuovo strumento.\u003c/p>\n\u003ch2>Prova guidata\u003c/h2>\n\u003cp>Nel laboratorio cambia il profilo di densità delle quattro sezioni e ascolta l’anteprima ridotta. Il disegno mostra un indice didattico di attività, non LUFS o una previsione emotiva. Ricrea poi lo schema in 16 battute vere: ogni blocco dell’anteprima rappresenta una sezione, non la sua durata completa.\u003c/p>\n\u003cdiv id=\"lab-root\">\u003c/div>\n\n"},{"id":"15-armoniche","title":"Forme d’onda e serie armonica","group":4,"lab":"harmonics","question":"Il primo sovratono di una serie armonica è…","options":["La fondamentale","La seconda armonica","Sempre una componente disarmonica"],"answer":1,"explanation":"La fondamentale è la prima armonica; il primo sovratono è la componente successiva, cioè la seconda armonica.","text":"# Forme d’onda e serie armonica\n\n## Dal tempo allo spettro\nLa forma d’onda mostra come varia l’ampiezza nel tempo; lo spettro descrive le componenti in frequenza. Una sinusoide ideale contiene una sola frequenza. Sommare sinusoidi a diverse frequenze, ampiezze e fasi permette di costruire segnali più complessi. Per una forma periodica, le frequenze della serie di Fourier sono multipli interi della fondamentale.\n\n**Armonica n:** frequenza n × f₀. **Parziale:** qualsiasi componente identificabile, anche non multipla intera. **Sovratono:** componente sopra la fondamentale; nel caso armonico il primo sovratono è la seconda armonica. “Sovra-armonica” è meno preciso: qui distinguiamo armoniche, parziali e sovratoni.\n\n## Forme ideali, confrontate\n| Onda | Componenti | Andamento delle ampiezze |\n|---|---|---|\n| Sinusoide | Solo fondamentale | Una componente |\n| Sega | Tutte le armoniche | Circa 1/n |\n| Quadra simmetrica | Solo armoniche dispari | Circa 1/n |\n| Triangolare simmetrica | Solo dispari | Circa 1/n², fasi alternate |\n\nLa fase relativa conta per la forma ricostruita. Due spettri di ampiezza uguali possono produrre forme temporali differenti. Le onde digitali reali sono limitate in banda: non contengono infinite armoniche come i modelli ideali.\n\n## Tre modi di leggere una sega\n**Tempo:** rampa e ritorno rapido. **Spettro:** componenti a f₀, 2f₀, 3f₀ e così via, progressivamente più deboli. **Ascolto:** maggiore presenza nelle alte frequenze rispetto a una sinusoide alla stessa fondamentale, senza che questo equivalga automaticamente a più loudness.\n\nA f₀ = 110 Hz trovi 110, 220, 330, 440, 550 Hz. La terza armonica è una quinta sopra la seconda; la quinta armonica corrisponde a una terza maggiore pura sopra una fondamentale trasposta di due ottave. Il sistema armonico naturale e il temperamento equabile sono vicini in alcuni rapporti, ma non identici.\n\n## Prova guidata\nScegli una forma, poi aumenta il numero di armoniche da 1 a 16. Il grafico della forma è una somma matematica e le barre sono le ampiezze impostate: non è una FFT del tuo dispositivo. L’ascolto usa la stessa serie troncata, con normalizzazione conservativa basata sulla somma delle ampiezze. Confronta il cambiamento timbrico a volume moderato.\n\n\u003c!-- LAB:harmonics | Implementato nell’HTML; vedi laboratori.js. -->\n\n## Verifica\n\nIl primo sovratono di una serie armonica è…\n\n1. La fondamentale\n2. La seconda armonica\n3. Sempre una componente disarmonica\n\n\u003cdetails>\u003csummary>Soluzione ragionata\u003c/summary>\n\nLa fondamentale è la prima armonica; il primo sovratono è la componente successiva, cioè la seconda armonica.\n\n\u003c/details>\n","html":"\u003ch2>Dal tempo allo spettro\u003c/h2>\n\u003cp>La forma d’onda mostra come varia l’ampiezza nel tempo; lo spettro descrive le componenti in frequenza. Una sinusoide ideale contiene una sola frequenza. Sommare sinusoidi a diverse frequenze, ampiezze e fasi permette di costruire segnali più complessi. Per una forma periodica, le frequenze della serie di Fourier sono multipli interi della fondamentale.\u003c/p>\n\u003cp>\u003cstrong>Armonica n:\u003c/strong> frequenza n × f₀. \u003cstrong>Parziale:\u003c/strong> qualsiasi componente identificabile, anche non multipla intera. \u003cstrong>Sovratono:\u003c/strong> componente sopra la fondamentale; nel caso armonico il primo sovratono è la seconda armonica. “Sovra-armonica” è meno preciso: qui distinguiamo armoniche, parziali e sovratoni.\u003c/p>\n\u003ch2>Forme ideali, confrontate\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Onda\u003c/th>\n\u003cth>Componenti\u003c/th>\n\u003cth>Andamento delle ampiezze\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Sinusoide\u003c/td>\n\u003ctd>Solo fondamentale\u003c/td>\n\u003ctd>Una componente\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sega\u003c/td>\n\u003ctd>Tutte le armoniche\u003c/td>\n\u003ctd>Circa 1/n\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Quadra simmetrica\u003c/td>\n\u003ctd>Solo armoniche dispari\u003c/td>\n\u003ctd>Circa 1/n\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Triangolare simmetrica\u003c/td>\n\u003ctd>Solo dispari\u003c/td>\n\u003ctd>Circa 1/n², fasi alternate\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>La fase relativa conta per la forma ricostruita. Due spettri di ampiezza uguali possono produrre forme temporali differenti. Le onde digitali reali sono limitate in banda: non contengono infinite armoniche come i modelli ideali.\u003c/p>\n\u003ch2>Tre modi di leggere una sega\u003c/h2>\n\u003cp>\u003cstrong>Tempo:\u003c/strong> rampa e ritorno rapido. \u003cstrong>Spettro:\u003c/strong> componenti a f₀, 2f₀, 3f₀ e così via, progressivamente più deboli. \u003cstrong>Ascolto:\u003c/strong> maggiore presenza nelle alte frequenze rispetto a una sinusoide alla stessa fondamentale, senza che questo equivalga automaticamente a più loudness.\u003c/p>\n\u003cp>A f₀ = 110 Hz trovi 110, 220, 330, 440, 550 Hz. La terza armonica è una quinta sopra la seconda; la quinta armonica corrisponde a una terza maggiore pura sopra una fondamentale trasposta di due ottave. Il sistema armonico naturale e il temperamento equabile sono vicini in alcuni rapporti, ma non identici.\u003c/p>\n\u003ch2>Prova guidata\u003c/h2>\n\u003cp>Scegli una forma, poi aumenta il numero di armoniche da 1 a 16. Il grafico della forma è una somma matematica e le barre sono le ampiezze impostate: non è una FFT del tuo dispositivo. L’ascolto usa la stessa serie troncata, con normalizzazione conservativa basata sulla somma delle ampiezze. Confronta il cambiamento timbrico a volume moderato.\u003c/p>\n\u003cdiv id=\"lab-root\">\u003c/div>\n\n"},{"id":"16-fase","title":"Fase, polarità, ritardo e battimenti","group":4,"lab":"phase","question":"Un ritardo di 1 ms produce lo stesso angolo di fase a ogni frequenza?","options":["Sì","No","Solo in mono"],"answer":1,"explanation":"La fase dipende da frequenza × ritardo: lo stesso tempo corrisponde a porzioni diverse di ciclo.","text":"# Fase, polarità, ritardo e battimenti\n\n## Tre operazioni diverse\nLa **fase** indica la posizione nel ciclo di una componente periodica. La **polarità** moltiplica il segnale per −1. Il **ritardo** sposta nel tempo l’intero segnale. Per una sola sinusoide, invertire la polarità equivale a spostare la fase di 180°; per un segnale complesso non equivale a un unico ritardo che inverta tutte le frequenze.\n\nLo sfasamento introdotto da un ritardo τ è −360° × f × τ, modulo 360°. Con 1 ms, 500 Hz subisce mezzo ciclo e 1000 Hz un ciclo completo. Ecco perché un ritardo produce effetti diversi sulle diverse componenti.\n\n## Sommare due sinusoidi uguali\n**Disegno:** creste allineate si sommano, creste contro valli si sottraggono. **Formula:** con ampiezza individuale a e differenza φ, l’ampiezza risultante è 2a × |cos(φ/2)|. **Ascolto:** a 0° il segnale raddoppia in ampiezza, circa +6,02 dB; a 180° si annulla idealmente. Occorrono uguale frequenza, uguale ampiezza e somma nello stesso canale.\n\nLa cancellazione di due segnali elettrici identici è un modello esatto. Due diffusori in una stanza aggiungono percorsi e riflessioni: l’effetto varia nello spazio. Due suoni non correlati non si sommano normalmente di +6 dB; raddoppiare la potenza media porta a circa +3 dB.\n\n## Battimenti e filtro a pettine\nDue sinusoidi vicine, come 220 e 222 Hz, producono pulsazioni d’ampiezza a circa 2 Hz. La fase relativa continua a cambiare: non rimangono ferme a un offset. Il **comb filtering** nasce sommando una copia ritardata e una diretta: per copie uguali e stessa polarità, i primi minimi sono a (2k+1)/(2τ). Con 1 ms trovi 500, 1500, 2500 Hz.\n\n## Prova guidata\nUsa frequenze identiche e passa da 0° a 180°. Il laboratorio mantiene fisso il guadagno delle singole componenti, così senti la somma. Attiva poi un piccolo detune e ascolta i battimenti; l’offset iniziale non descrive più una relazione statica. Il grafico segnala questa evoluzione mostrando una finestra iniziale dell’onda.\n\n\u003c!-- LAB:phase | Implementato nell’HTML; vedi laboratori.js. -->\n\n## Verifica\n\nUn ritardo di 1 ms produce lo stesso angolo di fase a ogni frequenza?\n\n1. Sì\n2. No\n3. Solo in mono\n\n\u003cdetails>\u003csummary>Soluzione ragionata\u003c/summary>\n\nLa fase dipende da frequenza × ritardo: lo stesso tempo corrisponde a porzioni diverse di ciclo.\n\n\u003c/details>\n","html":"\u003ch2>Tre operazioni diverse\u003c/h2>\n\u003cp>La \u003cstrong>fase\u003c/strong> indica la posizione nel ciclo di una componente periodica. La \u003cstrong>polarità\u003c/strong> moltiplica il segnale per −1. Il \u003cstrong>ritardo\u003c/strong> sposta nel tempo l’intero segnale. Per una sola sinusoide, invertire la polarità equivale a spostare la fase di 180°; per un segnale complesso non equivale a un unico ritardo che inverta tutte le frequenze.\u003c/p>\n\u003cp>Lo sfasamento introdotto da un ritardo τ è −360° × f × τ, modulo 360°. Con 1 ms, 500 Hz subisce mezzo ciclo e 1000 Hz un ciclo completo. Ecco perché un ritardo produce effetti diversi sulle diverse componenti.\u003c/p>\n\u003ch2>Sommare due sinusoidi uguali\u003c/h2>\n\u003cp>\u003cstrong>Disegno:\u003c/strong> creste allineate si sommano, creste contro valli si sottraggono. \u003cstrong>Formula:\u003c/strong> con ampiezza individuale a e differenza φ, l’ampiezza risultante è 2a × |cos(φ/2)|. \u003cstrong>Ascolto:\u003c/strong> a 0° il segnale raddoppia in ampiezza, circa +6,02 dB; a 180° si annulla idealmente. Occorrono uguale frequenza, uguale ampiezza e somma nello stesso canale.\u003c/p>\n\u003cp>La cancellazione di due segnali elettrici identici è un modello esatto. Due diffusori in una stanza aggiungono percorsi e riflessioni: l’effetto varia nello spazio. Due suoni non correlati non si sommano normalmente di +6 dB; raddoppiare la potenza media porta a circa +3 dB.\u003c/p>\n\u003ch2>Battimenti e filtro a pettine\u003c/h2>\n\u003cp>Due sinusoidi vicine, come 220 e 222 Hz, producono pulsazioni d’ampiezza a circa 2 Hz. La fase relativa continua a cambiare: non rimangono ferme a un offset. Il \u003cstrong>comb filtering\u003c/strong> nasce sommando una copia ritardata e una diretta: per copie uguali e stessa polarità, i primi minimi sono a (2k+1)/(2τ). Con 1 ms trovi 500, 1500, 2500 Hz.\u003c/p>\n\u003ch2>Prova guidata\u003c/h2>\n\u003cp>Usa frequenze identiche e passa da 0° a 180°. Il laboratorio mantiene fisso il guadagno delle singole componenti, così senti la somma. Attiva poi un piccolo detune e ascolta i battimenti; l’offset iniziale non descrive più una relazione statica. Il grafico segnala questa evoluzione mostrando una finestra iniziale dell’onda.\u003c/p>\n\u003cdiv id=\"lab-root\">\u003c/div>\n\n"},{"id":"17-modulazione","title":"AM, FM e modulazione del suono","group":4,"lab":"modulation","question":"Quale modulazione lenta produce normalmente tremolo?","options":["Ampiezza","Frequenza","Panorama soltanto"],"answer":0,"explanation":"Il tremolo è una variazione periodica di ampiezza; il vibrato riguarda l’altezza.","text":"# AM, FM e modulazione del suono\n\n## Sorgente, destinazione, profondità\nModulare significa far variare un parametro nel tempo. Una sorgente di controllo, per esempio un LFO o un inviluppo, muove una destinazione come ampiezza, frequenza o cutoff. La velocità e la profondità hanno ruoli distinti: quanto spesso cambia e quanto cambia.\n\n**AM:** varia l’ampiezza. A bassa frequenza senti tremolo; a frequenza audio compaiono bande laterali. **FM:** varia la frequenza istantanea. Lenta e poco profonda può produrre vibrato; veloce modifica il timbro. Modulare l’ampiezza non è vibrato; modulare l’altezza non è tremolo.\n\n## AM e ring modulation\nCon due sinusoidi, l’AM convenzionale può essere scritta [1 + m sin(2πfₘt)] sin(2πf꜀t). Per m fra 0 e 1 restano portante e bande a f꜀−fₘ e f꜀+fₘ. La ring modulation moltiplica invece due segnali bipolari senza il termine costante: idealmente sopprime la portante e conserva somma e differenza. Frequenze negative nel calcolo si ripiegano come componenti a frequenza positiva con la fase appropriata.\n\n## FM in tre letture\n**Gesto:** un oscillatore spinge avanti e indietro la frequenza di un altro. **Formula:** sin(2πf꜀t + β sin(2πfₘt)), dove β = Δf/fₘ per questa modulazione sinusoidale. **Spettro:** bande laterali a f꜀ ± n fₘ, con ampiezze che dipendono dall’indice β; non aumentano tutte in modo monotono.\n\nCon f꜀ = 220 Hz e fₘ = 110 Hz, le componenti appartengono a una griglia di 110 Hz. Rapporti semplici possono produrre spettri armonici; rapporti non interi rispetto alla portante non sono automaticamente tutti disarmonici, perché un rapporto razionale può avere una fondamentale comune più bassa. Rapporti complessi o irrazionali tendono a risultati metallici o inarmonici.\n\n## FM e PM nei sintetizzatori\nLa modulazione di fase e quella di frequenza sono correlate, ma non identiche per ogni segnale di controllo. Molti strumenti commercialmente chiamati FM usano architetture di modulazione di fase. Interpreta i parametri del singolo dispositivo; un valore di “Amount” non è necessariamente una deviazione in hertz.\n\n## Prova guidata\nSeleziona AM a 4 Hz e senti il tremolo; passa a FM e senti il vibrato. Aumenta la frequenza del modulatore e la profondità per entrare nel timbro. Nel modello FM la profondità è espressa come indice; in AM va da 0 a 1. Il disegno è una finestra temporale, non uno spettro misurato.\n\n\u003c!-- LAB:modulation | Implementato nell’HTML; vedi laboratori.js. -->\n\n## Verifica\n\nQuale modulazione lenta produce normalmente tremolo?\n\n1. Ampiezza\n2. Frequenza\n3. Panorama soltanto\n\n\u003cdetails>\u003csummary>Soluzione ragionata\u003c/summary>\n\nIl tremolo è una variazione periodica di ampiezza; il vibrato riguarda l’altezza.\n\n\u003c/details>\n","html":"\u003ch2>Sorgente, destinazione, profondità\u003c/h2>\n\u003cp>Modulare significa far variare un parametro nel tempo. Una sorgente di controllo, per esempio un LFO o un inviluppo, muove una destinazione come ampiezza, frequenza o cutoff. La velocità e la profondità hanno ruoli distinti: quanto spesso cambia e quanto cambia.\u003c/p>\n\u003cp>\u003cstrong>AM:\u003c/strong> varia l’ampiezza. A bassa frequenza senti tremolo; a frequenza audio compaiono bande laterali. \u003cstrong>FM:\u003c/strong> varia la frequenza istantanea. Lenta e poco profonda può produrre vibrato; veloce modifica il timbro. Modulare l’ampiezza non è vibrato; modulare l’altezza non è tremolo.\u003c/p>\n\u003ch2>AM e ring modulation\u003c/h2>\n\u003cp>Con due sinusoidi, l’AM convenzionale può essere scritta [1 + m sin(2πfₘt)] sin(2πf꜀t). Per m fra 0 e 1 restano portante e bande a f꜀−fₘ e f꜀+fₘ. La ring modulation moltiplica invece due segnali bipolari senza il termine costante: idealmente sopprime la portante e conserva somma e differenza. Frequenze negative nel calcolo si ripiegano come componenti a frequenza positiva con la fase appropriata.\u003c/p>\n\u003ch2>FM in tre letture\u003c/h2>\n\u003cp>\u003cstrong>Gesto:\u003c/strong> un oscillatore spinge avanti e indietro la frequenza di un altro. \u003cstrong>Formula:\u003c/strong> sin(2πf꜀t + β sin(2πfₘt)), dove β = Δf/fₘ per questa modulazione sinusoidale. \u003cstrong>Spettro:\u003c/strong> bande laterali a f꜀ ± n fₘ, con ampiezze che dipendono dall’indice β; non aumentano tutte in modo monotono.\u003c/p>\n\u003cp>Con f꜀ = 220 Hz e fₘ = 110 Hz, le componenti appartengono a una griglia di 110 Hz. Rapporti semplici possono produrre spettri armonici; rapporti non interi rispetto alla portante non sono automaticamente tutti disarmonici, perché un rapporto razionale può avere una fondamentale comune più bassa. Rapporti complessi o irrazionali tendono a risultati metallici o inarmonici.\u003c/p>\n\u003ch2>FM e PM nei sintetizzatori\u003c/h2>\n\u003cp>La modulazione di fase e quella di frequenza sono correlate, ma non identiche per ogni segnale di controllo. Molti strumenti commercialmente chiamati FM usano architetture di modulazione di fase. Interpreta i parametri del singolo dispositivo; un valore di “Amount” non è necessariamente una deviazione in hertz.\u003c/p>\n\u003ch2>Prova guidata\u003c/h2>\n\u003cp>Seleziona AM a 4 Hz e senti il tremolo; passa a FM e senti il vibrato. Aumenta la frequenza del modulatore e la profondità per entrare nel timbro. Nel modello FM la profondità è espressa come indice; in AM va da 0 a 1. Il disegno è una finestra temporale, non uno spettro misurato.\u003c/p>\n\u003cdiv id=\"lab-root\">\u003c/div>\n\n"},{"id":"18-inviluppi","title":"ADSR: dare forma al tempo","group":4,"lab":"adsr","question":"Quale parametro ADSR è un livello?","options":["Decay","Sustain","Release"],"answer":1,"explanation":"Sustain è il livello mantenuto finché il gate resta aperto; gli altri parametri indicano tempi.","text":"# ADSR: dare forma al tempo\n\n## Il suono è anche un evento\nL’inviluppo descrive l’evoluzione di un parametro. Nell’inviluppo d’ampiezza ADSR, **Attack** è il tempo di salita al picco; **Decay** il tempo verso il livello di **Sustain**; Sustain è un livello mantenuto durante il gate; **Release** è il tempo di discesa dopo il note-off. Tre parametri descrivono durate, uno descrive un livello.\n\nIl gate è l’intervallo fra note-on e note-off. Se rilasci il tasto durante l’attacco o il decadimento, molti strumenti passano al release dal livello raggiunto. Non è necessario completare tutte le fasi. Le curve possono essere lineari, esponenziali o regolabili; a uguale durata numerica possono suonare diverse.\n\n## Tre spiegazioni dell’attacco\n**Grafico:** la pendenza iniziale dell’ampiezza. **Gesto:** quanto rapidamente l’energia entra in scena. **Ascolto:** un attacco breve evidenzia l’inizio, uno lungo può rendere ambiguo il punto ritmico. Un attacco di ampiezza lento non elimina necessariamente tutti i transitori presenti in altre componenti o effetti.\n\n## Ricette motivate\n| Funzione | Attack | Decay | Sustain | Release |\n|---|---|---|---|---|\n| Pluck sintetico | 5 ms | 180 ms | 0,1 | 120 ms |\n| Pad morbido | 800 ms | 500 ms | 0,65 | 1,5 s |\n| Suono corto da sequenza | 5 ms | 90 ms | 0 | 60 ms |\n\nSono punti di partenza, non standard. Sustain a zero lascia spegnere il suono anche se il tasto resta premuto. Un release lungo può sovrapporre accordi consecutivi: ascolta il passaggio armonico, non soltanto la nota singola.\n\n## Un inviluppo, molte destinazioni\nSul filtro l’inviluppo cambia brillantezza; sul pitch produce una traiettoria di altezza; sull’ampiezza controlla il livello. La forma di controllo può essere identica ma il significato cambia. La profondità e il valore iniziale della destinazione determinano il risultato: un inviluppo filtro non ha effetto udibile se il cutoff è già oltre lo spettro presente.\n\n## Click e articolazione\nUn salto brusco nel segnale può generare un click. Pochi millisecondi di rampa spesso lo attenuano, ma anche punto di partenza del campione, fase e retrigger influiscono. Non allungare automaticamente l’attacco fino a perdere il groove.\n\n## Prova guidata\nConfronta pluck e pad, poi riduci il gate sotto l’Attack: il grafico deve entrare in release dal punto raggiunto. Il laboratorio usa rampe lineari didattiche e mostra il note-off; non riproduce ogni dettaglio degli inviluppi di Wavetable.\n\n\u003c!-- LAB:adsr | Implementato nell’HTML; vedi laboratori.js. -->\n\n## Verifica\n\nQuale parametro ADSR è un livello?\n\n1. Decay\n2. Sustain\n3. Release\n\n\u003cdetails>\u003csummary>Soluzione ragionata\u003c/summary>\n\nSustain è il livello mantenuto finché il gate resta aperto; gli altri parametri indicano tempi.\n\n\u003c/details>\n","html":"\u003ch2>Il suono è anche un evento\u003c/h2>\n\u003cp>L’inviluppo descrive l’evoluzione di un parametro. Nell’inviluppo d’ampiezza ADSR, \u003cstrong>Attack\u003c/strong> è il tempo di salita al picco; \u003cstrong>Decay\u003c/strong> il tempo verso il livello di \u003cstrong>Sustain\u003c/strong>; Sustain è un livello mantenuto durante il gate; \u003cstrong>Release\u003c/strong> è il tempo di discesa dopo il note-off. Tre parametri descrivono durate, uno descrive un livello.\u003c/p>\n\u003cp>Il gate è l’intervallo fra note-on e note-off. Se rilasci il tasto durante l’attacco o il decadimento, molti strumenti passano al release dal livello raggiunto. Non è necessario completare tutte le fasi. Le curve possono essere lineari, esponenziali o regolabili; a uguale durata numerica possono suonare diverse.\u003c/p>\n\u003ch2>Tre spiegazioni dell’attacco\u003c/h2>\n\u003cp>\u003cstrong>Grafico:\u003c/strong> la pendenza iniziale dell’ampiezza. \u003cstrong>Gesto:\u003c/strong> quanto rapidamente l’energia entra in scena. \u003cstrong>Ascolto:\u003c/strong> un attacco breve evidenzia l’inizio, uno lungo può rendere ambiguo il punto ritmico. Un attacco di ampiezza lento non elimina necessariamente tutti i transitori presenti in altre componenti o effetti.\u003c/p>\n\u003ch2>Ricette motivate\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Funzione\u003c/th>\n\u003cth>Attack\u003c/th>\n\u003cth>Decay\u003c/th>\n\u003cth>Sustain\u003c/th>\n\u003cth>Release\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Pluck sintetico\u003c/td>\n\u003ctd>5 ms\u003c/td>\n\u003ctd>180 ms\u003c/td>\n\u003ctd>0,1\u003c/td>\n\u003ctd>120 ms\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pad morbido\u003c/td>\n\u003ctd>800 ms\u003c/td>\n\u003ctd>500 ms\u003c/td>\n\u003ctd>0,65\u003c/td>\n\u003ctd>1,5 s\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Suono corto da sequenza\u003c/td>\n\u003ctd>5 ms\u003c/td>\n\u003ctd>90 ms\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>60 ms\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Sono punti di partenza, non standard. Sustain a zero lascia spegnere il suono anche se il tasto resta premuto. Un release lungo può sovrapporre accordi consecutivi: ascolta il passaggio armonico, non soltanto la nota singola.\u003c/p>\n\u003ch2>Un inviluppo, molte destinazioni\u003c/h2>\n\u003cp>Sul filtro l’inviluppo cambia brillantezza; sul pitch produce una traiettoria di altezza; sull’ampiezza controlla il livello. La forma di controllo può essere identica ma il significato cambia. La profondità e il valore iniziale della destinazione determinano il risultato: un inviluppo filtro non ha effetto udibile se il cutoff è già oltre lo spettro presente.\u003c/p>\n\u003ch2>Click e articolazione\u003c/h2>\n\u003cp>Un salto brusco nel segnale può generare un click. Pochi millisecondi di rampa spesso lo attenuano, ma anche punto di partenza del campione, fase e retrigger influiscono. Non allungare automaticamente l’attacco fino a perdere il groove.\u003c/p>\n\u003ch2>Prova guidata\u003c/h2>\n\u003cp>Confronta pluck e pad, poi riduci il gate sotto l’Attack: il grafico deve entrare in release dal punto raggiunto. Il laboratorio usa rampe lineari didattiche e mostra il note-off; non riproduce ogni dettaglio degli inviluppi di Wavetable.\u003c/p>\n\u003cdiv id=\"lab-root\">\u003c/div>\n\n"},{"id":"19-filtri","title":"Filtri, risonanza e spettro","group":4,"lab":"filter","question":"Un filtro lineare statico genera armoniche nuove da una sinusoide?","options":["Sì, sempre","No, cambia ampiezza e fase","Solo se è passa-alto"],"answer":1,"explanation":"Le nuove componenti richiedono non linearità o variazione nel tempo; il modello lineare statico non le genera.","text":"# Filtri, risonanza e spettro\n\n## Selezionare invece di riscrivere\nUn filtro lineare modifica ampiezza e fase delle componenti già presenti. Un passa-basso attenua le alte frequenze, un passa-alto le basse, un passa-banda seleziona una regione, un notch ne attenua una. Un filtro ideale con taglio verticale è un modello, non il comportamento ordinario di un dispositivo reale.\n\nIl cutoff è una frequenza di riferimento definita dal progetto. In alcuni filtri coincide con −3 dB, ma non è una legge universale, soprattutto con risonanza. La pendenza asintotica si esprime in dB per ottava: ogni polo contribuisce tipicamente circa 6 dB/ottava lontano dalla transizione. Due poli danno circa 12, quattro circa 24. Vicino al cutoff la curva non è una retta.\n\n## Risonanza in tre modi\n**Grafico:** un rilievo vicino alla frequenza caratteristica. **Tempo:** una tendenza a risuonare o prolungare una risposta oscillatoria. **Ascolto:** una regione spettrale diventa prominente. Il parametro Q è legato alla selettività, ma la mappatura di “Resonance” dipende dal sintetizzatore. Valori elevati possono aumentare il livello; alcuni circuiti possono auto-oscillare.\n\n## Armoniche e cutoff\nUna sega a 110 Hz ha componenti a 110, 220, 330 Hz e oltre. Abbassare un passa-basso riduce progressivamente quelle alte; non sposta automaticamente la fondamentale. Quando il contenuto alto diminuisce, il suono può sembrare più scuro anche mantenendo la stessa altezza. Il key tracking fa salire il cutoff con le note per conservare una relazione timbrica più coerente lungo la tastiera.\n\n## Lineare e non lineare\nUn filtro lineare tempo-invariante non crea nuove frequenze da una sinusoide stazionaria. Saturazione, drive e altri comportamenti non lineari possono invece generare armoniche o intermodulazione. Un filtro modulato nel tempo può produrre bande laterali. Dire “il filtro toglie e basta” è dunque corretto soltanto per un modello specifico.\n\n## Prova guidata\nConfronta passa-basso, passa-alto, passa-banda e notch sulla stessa sega. Cambia cutoff e Q separatamente. La curva visualizzata viene calcolata con la risposta del biquad Web Audio usato nell’ascolto; non è il modello analogico di Wavetable. La scala orizzontale è logaritmica: ogni ottava occupa lo stesso spazio. La verticale è in dB, con riferimento a guadagno unitario.\n\n\u003c!-- LAB:filter | Implementato nell’HTML; vedi laboratori.js. -->\n\n## Verifica\n\nUn filtro lineare statico genera armoniche nuove da una sinusoide?\n\n1. Sì, sempre\n2. No, cambia ampiezza e fase\n3. Solo se è passa-alto\n\n\u003cdetails>\u003csummary>Soluzione ragionata\u003c/summary>\n\nLe nuove componenti richiedono non linearità o variazione nel tempo; il modello lineare statico non le genera.\n\n\u003c/details>\n","html":"\u003ch2>Selezionare invece di riscrivere\u003c/h2>\n\u003cp>Un filtro lineare modifica ampiezza e fase delle componenti già presenti. Un passa-basso attenua le alte frequenze, un passa-alto le basse, un passa-banda seleziona una regione, un notch ne attenua una. Un filtro ideale con taglio verticale è un modello, non il comportamento ordinario di un dispositivo reale.\u003c/p>\n\u003cp>Il cutoff è una frequenza di riferimento definita dal progetto. In alcuni filtri coincide con −3 dB, ma non è una legge universale, soprattutto con risonanza. La pendenza asintotica si esprime in dB per ottava: ogni polo contribuisce tipicamente circa 6 dB/ottava lontano dalla transizione. Due poli danno circa 12, quattro circa 24. Vicino al cutoff la curva non è una retta.\u003c/p>\n\u003ch2>Risonanza in tre modi\u003c/h2>\n\u003cp>\u003cstrong>Grafico:\u003c/strong> un rilievo vicino alla frequenza caratteristica. \u003cstrong>Tempo:\u003c/strong> una tendenza a risuonare o prolungare una risposta oscillatoria. \u003cstrong>Ascolto:\u003c/strong> una regione spettrale diventa prominente. Il parametro Q è legato alla selettività, ma la mappatura di “Resonance” dipende dal sintetizzatore. Valori elevati possono aumentare il livello; alcuni circuiti possono auto-oscillare.\u003c/p>\n\u003ch2>Armoniche e cutoff\u003c/h2>\n\u003cp>Una sega a 110 Hz ha componenti a 110, 220, 330 Hz e oltre. Abbassare un passa-basso riduce progressivamente quelle alte; non sposta automaticamente la fondamentale. Quando il contenuto alto diminuisce, il suono può sembrare più scuro anche mantenendo la stessa altezza. Il key tracking fa salire il cutoff con le note per conservare una relazione timbrica più coerente lungo la tastiera.\u003c/p>\n\u003ch2>Lineare e non lineare\u003c/h2>\n\u003cp>Un filtro lineare tempo-invariante non crea nuove frequenze da una sinusoide stazionaria. Saturazione, drive e altri comportamenti non lineari possono invece generare armoniche o intermodulazione. Un filtro modulato nel tempo può produrre bande laterali. Dire “il filtro toglie e basta” è dunque corretto soltanto per un modello specifico.\u003c/p>\n\u003ch2>Prova guidata\u003c/h2>\n\u003cp>Confronta passa-basso, passa-alto, passa-banda e notch sulla stessa sega. Cambia cutoff e Q separatamente. La curva visualizzata viene calcolata con la risposta del biquad Web Audio usato nell’ascolto; non è il modello analogico di Wavetable. La scala orizzontale è logaritmica: ogni ottava occupa lo stesso spazio. La verticale è in dB, con riferimento a guadagno unitario.\u003c/p>\n\u003cdiv id=\"lab-root\">\u003c/div>\n\n"},{"id":"20-digitale","title":"Audio digitale, campionamento e aliasing","group":4,"lab":"alias","question":"Perché l’EQ dopo il campionamento non elimina selettivamente tutto l’aliasing?","options":["Perché le componenti false sono già ripiegate su frequenze valide","Perché i bit sono sempre insufficienti","Perché Nyquist dipende dal volume"],"answer":0,"explanation":"Dopo il ripiegamento una frequenza alias può essere indistinguibile da una componente reale nella stessa banda.","text":"# Audio digitale, campionamento e aliasing\n\n## Due risoluzioni diverse\nLa frequenza di campionamento descrive quante misure al secondo vengono prese; la profondità in bit riguarda la quantizzazione dei valori di ampiezza. Aumentare i bit non aumenta direttamente la massima frequenza rappresentabile. Aumentare il sample rate non aggiunge da solo dettaglio musicale a un file già limitato in banda.\n\nIl teorema del campionamento richiede un segnale limitato in banda sotto metà del sample rate. A 48 kHz, la frequenza di Nyquist è 24 kHz; nei sistemi reali serve spazio per la transizione dei filtri. I campioni non significano che l’uscita analogica corretta debba essere una scala a gradini: la ricostruzione usa un filtro.\n\n## Aliasing in tre modi\n**Ruota filmata:** un movimento troppo veloce può apparire più lento o invertito. **Frequenze:** componenti non rappresentabili si ripiegano nella banda disponibile. **Formula pratica:** per una sinusoide trovi una frequenza equivalente f_alias = |((f + fₛ/2) modulo fₛ) − fₛ/2|. Con fₛ = 8000 Hz, 6000 Hz appare a 2000 Hz nei campioni.\n\nUn filtro dopo il ripiegamento non sa più distinguere la componente falsa da una vera alla stessa frequenza. Per questo si filtra prima della conversione e si usano oscillatori limitati in banda. Distorsione e modulazione possono creare nuove componenti sopra Nyquist durante l’elaborazione: l’oversampling alza temporaneamente la frequenza interna e filtra prima di ridiscendere.\n\n## Quantizzazione, dither e clipping\nLa quantizzazione arrotonda i valori. Il dither è un piccolo rumore deliberato che rende l’errore meno correlato al segnale quando si riduce la profondità in bit; non recupera dettaglio perso. La regola circa 6,02N + 1,76 dB per N bit riguarda il rapporto segnale/rumore ideale di una sinusoide a piena scala con precise ipotesi, non il range dinamico di ogni registrazione.\n\nIn PCM intero 0 dBFS è il massimo riferimento numerico. Pipeline in virgola mobile possono rappresentare valori oltre 0 dBFS internamente, ma conversioni, plugin e uscita possono comunque saturare. Conservare margine facilita il lavoro.\n\n## Prova guidata\nIl laboratorio simula un sample rate basso con punti di campionamento. Ascolta separatamente la sinusoide originale e quella equivalente: non sta cambiando il sample rate della scheda audio. Osserva che i valori campionati possono coincidere pur descrivendo oscillazioni diverse fra un campione e l’altro.\n\n\u003c!-- LAB:alias | Implementato nell’HTML; vedi laboratori.js. -->\n\n## Verifica\n\nPerché l’EQ dopo il campionamento non elimina selettivamente tutto l’aliasing?\n\n1. Perché le componenti false sono già ripiegate su frequenze valide\n2. Perché i bit sono sempre insufficienti\n3. Perché Nyquist dipende dal volume\n\n\u003cdetails>\u003csummary>Soluzione ragionata\u003c/summary>\n\nDopo il ripiegamento una frequenza alias può essere indistinguibile da una componente reale nella stessa banda.\n\n\u003c/details>\n","html":"\u003ch2>Due risoluzioni diverse\u003c/h2>\n\u003cp>La frequenza di campionamento descrive quante misure al secondo vengono prese; la profondità in bit riguarda la quantizzazione dei valori di ampiezza. Aumentare i bit non aumenta direttamente la massima frequenza rappresentabile. Aumentare il sample rate non aggiunge da solo dettaglio musicale a un file già limitato in banda.\u003c/p>\n\u003cp>Il teorema del campionamento richiede un segnale limitato in banda sotto metà del sample rate. A 48 kHz, la frequenza di Nyquist è 24 kHz; nei sistemi reali serve spazio per la transizione dei filtri. I campioni non significano che l’uscita analogica corretta debba essere una scala a gradini: la ricostruzione usa un filtro.\u003c/p>\n\u003ch2>Aliasing in tre modi\u003c/h2>\n\u003cp>\u003cstrong>Ruota filmata:\u003c/strong> un movimento troppo veloce può apparire più lento o invertito. \u003cstrong>Frequenze:\u003c/strong> componenti non rappresentabili si ripiegano nella banda disponibile. \u003cstrong>Formula pratica:\u003c/strong> per una sinusoide trovi una frequenza equivalente f_alias = |((f + fₛ/2) modulo fₛ) − fₛ/2|. Con fₛ = 8000 Hz, 6000 Hz appare a 2000 Hz nei campioni.\u003c/p>\n\u003cp>Un filtro dopo il ripiegamento non sa più distinguere la componente falsa da una vera alla stessa frequenza. Per questo si filtra prima della conversione e si usano oscillatori limitati in banda. Distorsione e modulazione possono creare nuove componenti sopra Nyquist durante l’elaborazione: l’oversampling alza temporaneamente la frequenza interna e filtra prima di ridiscendere.\u003c/p>\n\u003ch2>Quantizzazione, dither e clipping\u003c/h2>\n\u003cp>La quantizzazione arrotonda i valori. Il dither è un piccolo rumore deliberato che rende l’errore meno correlato al segnale quando si riduce la profondità in bit; non recupera dettaglio perso. La regola circa 6,02N + 1,76 dB per N bit riguarda il rapporto segnale/rumore ideale di una sinusoide a piena scala con precise ipotesi, non il range dinamico di ogni registrazione.\u003c/p>\n\u003cp>In PCM intero 0 dBFS è il massimo riferimento numerico. Pipeline in virgola mobile possono rappresentare valori oltre 0 dBFS internamente, ma conversioni, plugin e uscita possono comunque saturare. Conservare margine facilita il lavoro.\u003c/p>\n\u003ch2>Prova guidata\u003c/h2>\n\u003cp>Il laboratorio simula un sample rate basso con punti di campionamento. Ascolta separatamente la sinusoide originale e quella equivalente: non sta cambiando il sample rate della scheda audio. Osserva che i valori campionati possono coincidere pur descrivendo oscillazioni diverse fra un campione e l’altro.\u003c/p>\n\u003cdiv id=\"lab-root\">\u003c/div>\n\n"},{"id":"21-sintesi","title":"Architetture di sintesi: scegliere un modello","group":4,"lab":"synthesis","question":"Quale scelta rende più diretto controllare singole parziali?","options":["Sintesi additiva","Un EQ sul master necessariamente","Qualsiasi preset senza modifiche"],"answer":0,"explanation":"L’additiva espone direttamente le componenti da sommare; altre architetture possono ottenere risultati simili con gesti diversi.","text":"# Architetture di sintesi: scegliere un modello\n\n## Il modello guida il gesto\nUn’architettura descrive come viene generato e trasformato il segnale. Conoscere il percorso ti evita di cercare lo stesso controllo in strumenti concettualmente diversi. La qualità non cresce automaticamente con il numero di oscillatori o con la complessità del metodo.\n\n| Architettura | Idea centrale | Controllo espressivo |\n|---|---|---|\n| Sottrattiva | Sorgente ricca, poi filtrata | Cutoff, risonanza, inviluppo |\n| Additiva | Somma di parziali | Ampiezza e andamento di ciascuna |\n| FM / PM | Oscillatori che modulano altri oscillatori | Rapporti, indice, algoritmo |\n| Wavetable | Lettura e scansione di forme memorizzate | Posizione e interpolazione |\n| Granulare | Frammenti brevi sovrapposti | Durata, densità, posizione, pitch |\n| Modeling fisico | Eccitazione di un modello risonante | Materiale, geometria, smorzamento |\n| Campionamento | Riproduzione di audio registrato | Start, loop, trasposizione |\n\n## Tre confronti concreti\nPer un basso semplice, una sorgente armonicamente ricca con filtro e inviluppo può bastare. Per un suono di campana, parziali inarmoniche e decadimenti diversi sono utili: additiva, FM o modelli risonanti sono percorsi plausibili. Per una texture di voce che si scompone, la granulare permette di separare in parte durata, posizione e intonazione.\n\nQueste sono scelte operative, non esclusive. Puoi creare una campana con un campione o una texture con sottrattiva. La domanda è quale architettura espone i parametri che vuoi controllare.\n\n## Wavetable, unison e granularità\nScansionare una wavetable cambia il profilo del ciclo e lo spettro. Non equivale necessariamente a riprodurre una registrazione dall’inizio alla fine. Unison somma più voci, spesso con detune e stereo: aumenta densità ma può cambiare fase, livello e leggibilità. Nella granulare, grani troppo distanziati diventano eventi riconoscibili; più sovrapposizione può creare una trama continua. Le finestre dei grani riducono discontinuità ai bordi.\n\n## Feedback e stabilità\nIl feedback rimanda parte del segnale a uno stadio precedente; può arricchire il timbro o produrre instabilità secondo guadagno, fase e struttura. Non è semplicemente “più armoniche”. Molte architetture avanzate combinano più metodi; conviene ricostruire il percorso a blocchi prima di usare tutti i controlli.\n\n## Prova guidata\nIl laboratorio confronta tre modelli realmente implementati: sottrattiva, additiva e FM, alla stessa frequenza di base. Una manopola cambia un parametro diverso, esplicitato sotto il controllo. Granulare e modeling fisico sono spiegati qui, ma non simulati da questo modulo. Per l’esplorazione specifica di Wavetable usa la guida precedente.\n\n\u003c!-- LAB:synthesis | Implementato nell’HTML; vedi laboratori.js. -->\n\n## Verifica\n\nQuale scelta rende più diretto controllare singole parziali?\n\n1. Sintesi additiva\n2. Un EQ sul master necessariamente\n3. Qualsiasi preset senza modifiche\n\n\u003cdetails>\u003csummary>Soluzione ragionata\u003c/summary>\n\nL’additiva espone direttamente le componenti da sommare; altre architetture possono ottenere risultati simili con gesti diversi.\n\n\u003c/details>\n","html":"\u003ch2>Il modello guida il gesto\u003c/h2>\n\u003cp>Un’architettura descrive come viene generato e trasformato il segnale. Conoscere il percorso ti evita di cercare lo stesso controllo in strumenti concettualmente diversi. La qualità non cresce automaticamente con il numero di oscillatori o con la complessità del metodo.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Architettura\u003c/th>\n\u003cth>Idea centrale\u003c/th>\n\u003cth>Controllo espressivo\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Sottrattiva\u003c/td>\n\u003ctd>Sorgente ricca, poi filtrata\u003c/td>\n\u003ctd>Cutoff, risonanza, inviluppo\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Additiva\u003c/td>\n\u003ctd>Somma di parziali\u003c/td>\n\u003ctd>Ampiezza e andamento di ciascuna\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FM / PM\u003c/td>\n\u003ctd>Oscillatori che modulano altri oscillatori\u003c/td>\n\u003ctd>Rapporti, indice, algoritmo\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Wavetable\u003c/td>\n\u003ctd>Lettura e scansione di forme memorizzate\u003c/td>\n\u003ctd>Posizione e interpolazione\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Granulare\u003c/td>\n\u003ctd>Frammenti brevi sovrapposti\u003c/td>\n\u003ctd>Durata, densità, posizione, pitch\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Modeling fisico\u003c/td>\n\u003ctd>Eccitazione di un modello risonante\u003c/td>\n\u003ctd>Materiale, geometria, smorzamento\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Campionamento\u003c/td>\n\u003ctd>Riproduzione di audio registrato\u003c/td>\n\u003ctd>Start, loop, trasposizione\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2>Tre confronti concreti\u003c/h2>\n\u003cp>Per un basso semplice, una sorgente armonicamente ricca con filtro e inviluppo può bastare. Per un suono di campana, parziali inarmoniche e decadimenti diversi sono utili: additiva, FM o modelli risonanti sono percorsi plausibili. Per una texture di voce che si scompone, la granulare permette di separare in parte durata, posizione e intonazione.\u003c/p>\n\u003cp>Queste sono scelte operative, non esclusive. Puoi creare una campana con un campione o una texture con sottrattiva. La domanda è quale architettura espone i parametri che vuoi controllare.\u003c/p>\n\u003ch2>Wavetable, unison e granularità\u003c/h2>\n\u003cp>Scansionare una wavetable cambia il profilo del ciclo e lo spettro. Non equivale necessariamente a riprodurre una registrazione dall’inizio alla fine. Unison somma più voci, spesso con detune e stereo: aumenta densità ma può cambiare fase, livello e leggibilità. Nella granulare, grani troppo distanziati diventano eventi riconoscibili; più sovrapposizione può creare una trama continua. Le finestre dei grani riducono discontinuità ai bordi.\u003c/p>\n\u003ch2>Feedback e stabilità\u003c/h2>\n\u003cp>Il feedback rimanda parte del segnale a uno stadio precedente; può arricchire il timbro o produrre instabilità secondo guadagno, fase e struttura. Non è semplicemente “più armoniche”. Molte architetture avanzate combinano più metodi; conviene ricostruire il percorso a blocchi prima di usare tutti i controlli.\u003c/p>\n\u003ch2>Prova guidata\u003c/h2>\n\u003cp>Il laboratorio confronta tre modelli realmente implementati: sottrattiva, additiva e FM, alla stessa frequenza di base. Una manopola cambia un parametro diverso, esplicitato sotto il controllo. Granulare e modeling fisico sono spiegati qui, ma non simulati da questo modulo. Per l’esplorazione specifica di Wavetable usa la guida precedente.\u003c/p>\n\u003cdiv id=\"lab-root\">\u003c/div>\n\n"},{"id":"22-acustica","title":"Acustica, spazio e mixaggio","group":5,"lab":"space","question":"Una copia ritardata in stereo è sempre innocua in mono?","options":["Sì","No, può produrre interferenze e filtro a pettine","Solo se il delay è sincronizzato"],"answer":1,"explanation":"La somma mono combina copie correlate con ritardo; alcune frequenze possono attenuarsi e altre rinforzarsi.","text":"# Acustica, spazio e mixaggio\n\n## Il suono attraversa un ambiente\nNell’aria il suono è una variazione di pressione che si propaga. A temperatura ambiente la velocità è circa 343 m/s, variabile con le condizioni. La lunghezza d’onda λ = c/f: a 100 Hz è circa 3,43 metri; a 1000 Hz circa 34,3 centimetri. Le basse frequenze interagiscono quindi con dimensioni importanti della stanza.\n\nIl suono diretto arriva per primo; riflessioni precoci e coda riverberante aggiungono percorsi. Le riflessioni non sono soltanto “più volume”: possono alterare localizzazione, chiarezza e risposta in frequenza. Il tempo di riverberazione RT60 descrive una discesa di 60 dB nel decadimento dell’ambiente; la sua misura richiede procedure e condizioni, non basta leggere il tempo di un preset.\n\n## Modi della stanza e posizione\nIn una stanza rettangolare rigida semplificata, i modi assiali hanno frequenze fₙ = n c/(2L). Con L = 4 metri il primo è circa 42,9 Hz. Anche le altre dimensioni e i modi tangenziali e obliqui contribuiscono. In nodi e ventri la pressione varia: spostare ascoltatore o diffusore può cambiare molto il basso. Una forte cancellazione geometrica non si risolve bene aggiungendo guadagno con un EQ.\n\n## Spazio in produzione\n**Panorama:** distribuzione fra canali. **Profondità:** relazione fra diretto, riflessioni, spettro e dinamica. **Larghezza:** differenze e correlazione fra canali. Un suono lontano non è soltanto più riverberato; meno transiente e meno dettaglio possono contribuire alla distanza percepita.\n\nIl predelay separa l’attacco dalla risposta riverberante. Il rapporto dry/wet regola il rapporto fra diretto ed effetto. Una copia ritardata di pochi millisecondi può allargare in stereo ma generare un filtro a pettine quando sommata in mono. Controlla sempre la compatibilità nel contesto.\n\n## Prova guidata\nIl laboratorio usa una copia ritardata, non un riverbero di stanza. Cambia il ritardo da pochi a molti millisecondi: da interferenza e fusione passi a un’eco distinta. Alterna stereo e somma mono; la somma è mediata per evitare un semplice raddoppio del livello. La risposta dipende dalla correlazione del segnale, non dal solo numero scritto sul controllo.\n\n\u003c!-- LAB:space | Implementato nell’HTML; vedi laboratori.js. -->\n\n## Verifica\n\nUna copia ritardata in stereo è sempre innocua in mono?\n\n1. Sì\n2. No, può produrre interferenze e filtro a pettine\n3. Solo se il delay è sincronizzato\n\n\u003cdetails>\u003csummary>Soluzione ragionata\u003c/summary>\n\nLa somma mono combina copie correlate con ritardo; alcune frequenze possono attenuarsi e altre rinforzarsi.\n\n\u003c/details>\n","html":"\u003ch2>Il suono attraversa un ambiente\u003c/h2>\n\u003cp>Nell’aria il suono è una variazione di pressione che si propaga. A temperatura ambiente la velocità è circa 343 m/s, variabile con le condizioni. La lunghezza d’onda λ = c/f: a 100 Hz è circa 3,43 metri; a 1000 Hz circa 34,3 centimetri. Le basse frequenze interagiscono quindi con dimensioni importanti della stanza.\u003c/p>\n\u003cp>Il suono diretto arriva per primo; riflessioni precoci e coda riverberante aggiungono percorsi. Le riflessioni non sono soltanto “più volume”: possono alterare localizzazione, chiarezza e risposta in frequenza. Il tempo di riverberazione RT60 descrive una discesa di 60 dB nel decadimento dell’ambiente; la sua misura richiede procedure e condizioni, non basta leggere il tempo di un preset.\u003c/p>\n\u003ch2>Modi della stanza e posizione\u003c/h2>\n\u003cp>In una stanza rettangolare rigida semplificata, i modi assiali hanno frequenze fₙ = n c/(2L). Con L = 4 metri il primo è circa 42,9 Hz. Anche le altre dimensioni e i modi tangenziali e obliqui contribuiscono. In nodi e ventri la pressione varia: spostare ascoltatore o diffusore può cambiare molto il basso. Una forte cancellazione geometrica non si risolve bene aggiungendo guadagno con un EQ.\u003c/p>\n\u003ch2>Spazio in produzione\u003c/h2>\n\u003cp>\u003cstrong>Panorama:\u003c/strong> distribuzione fra canali. \u003cstrong>Profondità:\u003c/strong> relazione fra diretto, riflessioni, spettro e dinamica. \u003cstrong>Larghezza:\u003c/strong> differenze e correlazione fra canali. Un suono lontano non è soltanto più riverberato; meno transiente e meno dettaglio possono contribuire alla distanza percepita.\u003c/p>\n\u003cp>Il predelay separa l’attacco dalla risposta riverberante. Il rapporto dry/wet regola il rapporto fra diretto ed effetto. Una copia ritardata di pochi millisecondi può allargare in stereo ma generare un filtro a pettine quando sommata in mono. Controlla sempre la compatibilità nel contesto.\u003c/p>\n\u003ch2>Prova guidata\u003c/h2>\n\u003cp>Il laboratorio usa una copia ritardata, non un riverbero di stanza. Cambia il ritardo da pochi a molti millisecondi: da interferenza e fusione passi a un’eco distinta. Alterna stereo e somma mono; la somma è mediata per evitare un semplice raddoppio del livello. La risposta dipende dalla correlazione del segnale, non dal solo numero scritto sul controllo.\u003c/p>\n\u003cdiv id=\"lab-root\">\u003c/div>\n\n"},{"id":"23-percezione","title":"Psicoacustica: ascoltare con criterio","group":5,"lab":"psycho","question":"Sentire una fondamentale significa che quella frequenza è sempre presente?","options":["Sì","No, può essere ricostruita percettivamente","Solo nelle cuffie"],"answer":1,"explanation":"La struttura delle armoniche può evocare una fondamentale assente nello spettro fisico.","text":"# Psicoacustica: ascoltare con criterio\n\n## Misura e sensazione non coincidono\nLa frequenza è fisica, l’altezza è percettiva; l’ampiezza è fisica, la loudness è percettiva. Il sistema uditivo integra informazione spettrale e temporale. Il contesto e l’attenzione influiscono su ciò che emerge: non ascoltiamo ogni componente come un misuratore indipendente.\n\n## Mascheramento in tre modi\n**Ascolto:** un elemento diventa meno distinguibile in presenza di un altro. **Spettro:** energia vicina può competere entro regioni di analisi uditiva; le bande uditive non hanno larghezza costante in hertz. **Arrangiamento:** due parti molto simili, simultanee e nello stesso registro chiedono attenzione allo stesso spazio. Spostare una frase nel tempo può essere più efficace di alzare il volume.\n\nIl mascheramento può essere simultaneo o temporale: un evento intenso può influire sulla percezione di un evento vicino nel tempo. Non c’è una singola frequenza da tagliare valida per ogni coppia di strumenti. Livello, spettro, durata e ascoltatore contano.\n\n## Fondamentale mancante\nSe ascolti componenti a 220, 330 e 440 Hz, il cervello può ricostruire un’altezza corrispondente a 110 Hz pur senza energia fisica a 110 Hz. La periodicità comune e la struttura delle armoniche contribuiscono. L’effetto dipende da quali componenti sono presenti, dal livello e dalle condizioni di ascolto. Il basso può risultare riconoscibile su piccoli diffusori tramite le armoniche, senza che il sistema riproduca davvero la fondamentale.\n\n## Livello, brillantezza e aspettativa\nL’orecchio non ha la stessa sensibilità a tutte le frequenze e questa relazione cambia con il livello. Le curve di uguale sensazione sonora non sono una curva EQ da applicare automaticamente. Confronti più forti possono sembrare più dettagliati: per giudicare un trattamento cerca livelli percepiti simili e alterna rapidamente, poi verifica nel brano.\n\n## Localizzazione e precedenza\nDifferenze di tempo e livello fra le orecchie, insieme ai filtraggi di testa e padiglioni, aiutano a localizzare. Una riflessione ravvicinata può fondersi con il diretto e influire sulla spazialità senza essere sentita come eco separata. Non ridurre tutto a una soglia temporale universale.\n\n## Prova guidata\nTogli e rimetti la fondamentale lasciando le altre armoniche invariate. Ascolta se l’altezza resta riconoscibile mentre cambia il peso timbrico. Il livello totale cambia: questo è un esperimento di altezza residua, non un test di preferenza né una misura clinica dell’udito.\n\n\u003c!-- LAB:psycho | Implementato nell’HTML; vedi laboratori.js. -->\n\n## Verifica\n\nSentire una fondamentale significa che quella frequenza è sempre presente?\n\n1. Sì\n2. No, può essere ricostruita percettivamente\n3. Solo nelle cuffie\n\n\u003cdetails>\u003csummary>Soluzione ragionata\u003c/summary>\n\nLa struttura delle armoniche può evocare una fondamentale assente nello spettro fisico.\n\n\u003c/details>\n","html":"\u003ch2>Misura e sensazione non coincidono\u003c/h2>\n\u003cp>La frequenza è fisica, l’altezza è percettiva; l’ampiezza è fisica, la loudness è percettiva. Il sistema uditivo integra informazione spettrale e temporale. Il contesto e l’attenzione influiscono su ciò che emerge: non ascoltiamo ogni componente come un misuratore indipendente.\u003c/p>\n\u003ch2>Mascheramento in tre modi\u003c/h2>\n\u003cp>\u003cstrong>Ascolto:\u003c/strong> un elemento diventa meno distinguibile in presenza di un altro. \u003cstrong>Spettro:\u003c/strong> energia vicina può competere entro regioni di analisi uditiva; le bande uditive non hanno larghezza costante in hertz. \u003cstrong>Arrangiamento:\u003c/strong> due parti molto simili, simultanee e nello stesso registro chiedono attenzione allo stesso spazio. Spostare una frase nel tempo può essere più efficace di alzare il volume.\u003c/p>\n\u003cp>Il mascheramento può essere simultaneo o temporale: un evento intenso può influire sulla percezione di un evento vicino nel tempo. Non c’è una singola frequenza da tagliare valida per ogni coppia di strumenti. Livello, spettro, durata e ascoltatore contano.\u003c/p>\n\u003ch2>Fondamentale mancante\u003c/h2>\n\u003cp>Se ascolti componenti a 220, 330 e 440 Hz, il cervello può ricostruire un’altezza corrispondente a 110 Hz pur senza energia fisica a 110 Hz. La periodicità comune e la struttura delle armoniche contribuiscono. L’effetto dipende da quali componenti sono presenti, dal livello e dalle condizioni di ascolto. Il basso può risultare riconoscibile su piccoli diffusori tramite le armoniche, senza che il sistema riproduca davvero la fondamentale.\u003c/p>\n\u003ch2>Livello, brillantezza e aspettativa\u003c/h2>\n\u003cp>L’orecchio non ha la stessa sensibilità a tutte le frequenze e questa relazione cambia con il livello. Le curve di uguale sensazione sonora non sono una curva EQ da applicare automaticamente. Confronti più forti possono sembrare più dettagliati: per giudicare un trattamento cerca livelli percepiti simili e alterna rapidamente, poi verifica nel brano.\u003c/p>\n\u003ch2>Localizzazione e precedenza\u003c/h2>\n\u003cp>Differenze di tempo e livello fra le orecchie, insieme ai filtraggi di testa e padiglioni, aiutano a localizzare. Una riflessione ravvicinata può fondersi con il diretto e influire sulla spazialità senza essere sentita come eco separata. Non ridurre tutto a una soglia temporale universale.\u003c/p>\n\u003ch2>Prova guidata\u003c/h2>\n\u003cp>Togli e rimetti la fondamentale lasciando le altre armoniche invariate. Ascolta se l’altezza resta riconoscibile mentre cambia il peso timbrico. Il livello totale cambia: questo è un esperimento di altezza residua, non un test di preferenza né una misura clinica dell’udito.\u003c/p>\n\u003cdiv id=\"lab-root\">\u003c/div>\n\n"},{"id":"24-ritmi-avanzati","title":"Ritmi euclidei, poliritmia e modulazione metrica","group":5,"lab":"euclid","question":"Se il vecchio quarto puntato diventa il nuovo quarto, da 120 BPM passi a…","options":["180 BPM","80 BPM","120 BPM"],"answer":1,"explanation":"Il nuovo quarto dura 1,5 vecchi quarti: il tempo diventa 120 ÷ 1,5 = 80 BPM.","text":"# Ritmi euclidei, poliritmia e modulazione metrica\n\n## Distribuire eventi in modo uniforme\nUn ritmo euclideo E(k,n) distribuisce k colpi in n posizioni cercando intervalli il più possibile uniformi. E(3,8) produce distanze cicliche 3–3–2, a rotazione vicino: una possibile sequenza è X··X··X·. La rotazione cambia dove senti l’inizio senza cambiare le distanze cicliche. Il nome dell’algoritmo non descrive da solo accenti, timbro o tradizione musicale.\n\nIl laboratorio usa un accumulatore equivalente per la distribuzione uniforme, con una convenzione di rotazione esplicita. Alcuni generatori iniziano da un’altra posizione o mostrano una sequenza invertita: confronta i gap ciclici, non solo la stringa.\n\n## Poliritmia e polimetria\n**Poliritmia:** suddivisioni diverse nello stesso intervallo, per esempio tre eventi equidistanti contro due. Per costruire 3:2, dividi l’intervallo comune in sei parti: una voce suona ogni due caselle, l’altra ogni tre. Si riallineano al ciclo successivo.\n\n**Polimetria:** raggruppamenti metrici differenti sopra una pulsazione comune, per esempio cicli di tre e quattro ottavi. Si riallineano dopo dodici ottavi. Le etichette dipendono anche da come gli accenti rendono percepibili i cicli, non soltanto dalla griglia matematica.\n\n## Modulazione metrica in tre passaggi\nScegli un valore ritmico del tempo vecchio, dichiaralo uguale a un valore del nuovo, ricava il rapporto. Se la vecchia semiminima puntata diventa la nuova semiminima, la nuova pulsazione dura 1,5 volte la vecchia: nuovo BPM = vecchio BPM × 2/3. Da 120 passi a 80 BPM.\n\nViceversa, se una vecchia semiminima di terzina, durata 2/3 di un quarto, diventa il nuovo quarto, il nuovo BPM è 120 × 3/2 = 180. **Formula generale:** se a quarti vecchi equivalgono a b quarti nuovi, BPM nuovo = BPM vecchio × b/a. Conservi una durata comune come ponte. Raddoppiare la densità ritmica senza cambiare la pulsazione percepita non è automaticamente modulazione metrica.\n\n## Prova guidata\nDistribuisci cinque colpi in sedici posizioni, poi ruota il pattern. Un clic basso marca l’inizio del ciclo. Prova anche il confronto 3:2 e il passaggio 120→80: il primo sovrappone divisioni, il secondo ridefinisce la pulsazione. Non confondere questi due ascolti.\n\n\u003c!-- LAB:euclid | Implementato nell’HTML; vedi laboratori.js. -->\n\n## Verifica\n\nSe il vecchio quarto puntato diventa il nuovo quarto, da 120 BPM passi a…\n\n1. 180 BPM\n2. 80 BPM\n3. 120 BPM\n\n\u003cdetails>\u003csummary>Soluzione ragionata\u003c/summary>\n\nIl nuovo quarto dura 1,5 vecchi quarti: il tempo diventa 120 ÷ 1,5 = 80 BPM.\n\n\u003c/details>\n","html":"\u003ch2>Distribuire eventi in modo uniforme\u003c/h2>\n\u003cp>Un ritmo euclideo E(k,n) distribuisce k colpi in n posizioni cercando intervalli il più possibile uniformi. E(3,8) produce distanze cicliche 3–3–2, a rotazione vicino: una possibile sequenza è X··X··X·. La rotazione cambia dove senti l’inizio senza cambiare le distanze cicliche. Il nome dell’algoritmo non descrive da solo accenti, timbro o tradizione musicale.\u003c/p>\n\u003cp>Il laboratorio usa un accumulatore equivalente per la distribuzione uniforme, con una convenzione di rotazione esplicita. Alcuni generatori iniziano da un’altra posizione o mostrano una sequenza invertita: confronta i gap ciclici, non solo la stringa.\u003c/p>\n\u003ch2>Poliritmia e polimetria\u003c/h2>\n\u003cp>\u003cstrong>Poliritmia:\u003c/strong> suddivisioni diverse nello stesso intervallo, per esempio tre eventi equidistanti contro due. Per costruire 3:2, dividi l’intervallo comune in sei parti: una voce suona ogni due caselle, l’altra ogni tre. Si riallineano al ciclo successivo.\u003c/p>\n\u003cp>\u003cstrong>Polimetria:\u003c/strong> raggruppamenti metrici differenti sopra una pulsazione comune, per esempio cicli di tre e quattro ottavi. Si riallineano dopo dodici ottavi. Le etichette dipendono anche da come gli accenti rendono percepibili i cicli, non soltanto dalla griglia matematica.\u003c/p>\n\u003ch2>Modulazione metrica in tre passaggi\u003c/h2>\n\u003cp>Scegli un valore ritmico del tempo vecchio, dichiaralo uguale a un valore del nuovo, ricava il rapporto. Se la vecchia semiminima puntata diventa la nuova semiminima, la nuova pulsazione dura 1,5 volte la vecchia: nuovo BPM = vecchio BPM × 2/3. Da 120 passi a 80 BPM.\u003c/p>\n\u003cp>Viceversa, se una vecchia semiminima di terzina, durata 2/3 di un quarto, diventa il nuovo quarto, il nuovo BPM è 120 × 3/2 = 180. \u003cstrong>Formula generale:\u003c/strong> se a quarti vecchi equivalgono a b quarti nuovi, BPM nuovo = BPM vecchio × b/a. Conservi una durata comune come ponte. Raddoppiare la densità ritmica senza cambiare la pulsazione percepita non è automaticamente modulazione metrica.\u003c/p>\n\u003ch2>Prova guidata\u003c/h2>\n\u003cp>Distribuisci cinque colpi in sedici posizioni, poi ruota il pattern. Un clic basso marca l’inizio del ciclo. Prova anche il confronto 3:2 e il passaggio 120→80: il primo sovrappone divisioni, il secondo ridefinisce la pulsazione. Non confondere questi due ascolti.\u003c/p>\n\u003cdiv id=\"lab-root\">\u003c/div>\n\n"},{"id":"25-loudness","title":"Dinamica, decibel e loudness","group":5,"lab":"dynamics","question":"Con soglia −18 dB e ratio 4:1, un ingresso a −10 dB diventa staticamente…","options":["−16 dB prima del makeup","−40 dB","−2 dB"],"answer":0,"explanation":"Gli 8 dB sopra soglia diventano 2: −18 + 2 = −16 dB.","text":"# Dinamica, decibel e loudness\n\n## Rapporti prima dei numeri\nUn decibel esprime un rapporto logaritmico. Per ampiezze confrontabili: dB = 20 log₁₀(A₂/A₁). Per potenze: dB = 10 log₁₀(P₂/P₁). Raddoppiare l’ampiezza significa circa +6,02 dB; raddoppiare la potenza circa +3,01 dB. “Il doppio più forte” è una sensazione e non segue automaticamente nessuna delle due frasi.\n\n## Quattro misure da non confondere\n**Sample peak:** massimo valore dei campioni. **True peak:** stima del massimo del segnale ricostruito, che può superare i picchi campionati. **RMS:** radice della media dei quadrati, una misura di ampiezza efficace. **LUFS:** misura di loudness basata su pesatura e integrazione secondo una specifica procedura; non è un semplice RMS rinominato.\n\nLa raccomandazione ITU-R BS.1770 descrive algoritmi di loudness e true peak. I comuni misuratori distinguono momentary, short-term e integrated; il valore integrato rappresenta un tratto o programma con le regole di gating applicabili. Il target dipende dalla destinazione: un numero di normalizzazione di una piattaforma non è automaticamente un obbligo di mastering.\n\n## Energia e fattore di cresta\nIl fattore di cresta è la differenza in dB fra picco e RMS. Per una sinusoide ideale il valore RMS è il picco diviso √2, quindi circa 3,01 dB sotto il picco. Un segnale con transienti isolati può avere un picco alto e media bassa. Due brani con stesso picco possono essere percepiti molto diversamente.\n\n## Compressione in tre letture\n**Curva:** sopra la soglia l’uscita cresce meno dell’ingresso. **Esempio:** soglia −18 dB, ingresso −10 dB, ratio 4:1; 8 dB sopra soglia diventano 2, quindi uscita statica −16 dB prima del makeup. **Tempo:** Attack e Release determinano quanto rapidamente il processore raggiunge e abbandona quella riduzione. La curva statica non prevede da sola i transienti.\n\nKnee descrive la gradualità della transizione; makeup rialza il livello; detector e sidechain decidono a che cosa reagisce il processore. Un limiter impone un controllo più rigido dei picchi, ma un vero limite true-peak richiede una progettazione e una misura adatte.\n\n## Prova guidata\nIl laboratorio mostra una curva hard-knee senza memoria e applica una compressione didattica all’ampiezza di quattro eventi di prova. Non è un emulatore completo di compressore: non ha detector con Attack/Release e non misura LUFS. Confronta prima senza makeup, poi aggiungi guadagno; separa riduzione dei contrasti e semplice aumento di livello.\n\n\u003c!-- LAB:dynamics | Implementato nell’HTML; vedi laboratori.js. -->\n\n## Verifica\n\nCon soglia −18 dB e ratio 4:1, un ingresso a −10 dB diventa staticamente…\n\n1. −16 dB prima del makeup\n2. −40 dB\n3. −2 dB\n\n\u003cdetails>\u003csummary>Soluzione ragionata\u003c/summary>\n\nGli 8 dB sopra soglia diventano 2: −18 + 2 = −16 dB.\n\n\u003c/details>\n","html":"\u003ch2>Rapporti prima dei numeri\u003c/h2>\n\u003cp>Un decibel esprime un rapporto logaritmico. Per ampiezze confrontabili: dB = 20 log₁₀(A₂/A₁). Per potenze: dB = 10 log₁₀(P₂/P₁). Raddoppiare l’ampiezza significa circa +6,02 dB; raddoppiare la potenza circa +3,01 dB. “Il doppio più forte” è una sensazione e non segue automaticamente nessuna delle due frasi.\u003c/p>\n\u003ch2>Quattro misure da non confondere\u003c/h2>\n\u003cp>\u003cstrong>Sample peak:\u003c/strong> massimo valore dei campioni. \u003cstrong>True peak:\u003c/strong> stima del massimo del segnale ricostruito, che può superare i picchi campionati. \u003cstrong>RMS:\u003c/strong> radice della media dei quadrati, una misura di ampiezza efficace. \u003cstrong>LUFS:\u003c/strong> misura di loudness basata su pesatura e integrazione secondo una specifica procedura; non è un semplice RMS rinominato.\u003c/p>\n\u003cp>La raccomandazione ITU-R BS.1770 descrive algoritmi di loudness e true peak. I comuni misuratori distinguono momentary, short-term e integrated; il valore integrato rappresenta un tratto o programma con le regole di gating applicabili. Il target dipende dalla destinazione: un numero di normalizzazione di una piattaforma non è automaticamente un obbligo di mastering.\u003c/p>\n\u003ch2>Energia e fattore di cresta\u003c/h2>\n\u003cp>Il fattore di cresta è la differenza in dB fra picco e RMS. Per una sinusoide ideale il valore RMS è il picco diviso √2, quindi circa 3,01 dB sotto il picco. Un segnale con transienti isolati può avere un picco alto e media bassa. Due brani con stesso picco possono essere percepiti molto diversamente.\u003c/p>\n\u003ch2>Compressione in tre letture\u003c/h2>\n\u003cp>\u003cstrong>Curva:\u003c/strong> sopra la soglia l’uscita cresce meno dell’ingresso. \u003cstrong>Esempio:\u003c/strong> soglia −18 dB, ingresso −10 dB, ratio 4:1; 8 dB sopra soglia diventano 2, quindi uscita statica −16 dB prima del makeup. \u003cstrong>Tempo:\u003c/strong> Attack e Release determinano quanto rapidamente il processore raggiunge e abbandona quella riduzione. La curva statica non prevede da sola i transienti.\u003c/p>\n\u003cp>Knee descrive la gradualità della transizione; makeup rialza il livello; detector e sidechain decidono a che cosa reagisce il processore. Un limiter impone un controllo più rigido dei picchi, ma un vero limite true-peak richiede una progettazione e una misura adatte.\u003c/p>\n\u003ch2>Prova guidata\u003c/h2>\n\u003cp>Il laboratorio mostra una curva hard-knee senza memoria e applica una compressione didattica all’ampiezza di quattro eventi di prova. Non è un emulatore completo di compressore: non ha detector con Attack/Release e non misura LUFS. Confronta prima senza makeup, poi aggiungi guadagno; separa riduzione dei contrasti e semplice aumento di livello.\u003c/p>\n\u003cdiv id=\"lab-root\">\u003c/div>\n\n"},{"id":"26-progetto","title":"Progetto finale, diagnosi e glossario","group":6,"lab":"progression","question":"Quale intervento viene prima quando il pad copre il basso?","options":["Aumentare subito il master","Controllare note, registro e durata delle voci","Cambiare casualmente tutti i preset"],"answer":1,"explanation":"Una modifica all’arrangiamento può eliminare il conflitto alla fonte, prima di intervenire con il processing.","text":"# Progetto finale, diagnosi e glossario\n\n## Un brano breve che dimostra ciò che sai\nCostruisci 16 battute in C (Do) maggiore oppure A (La) minore. Scegli prima il centro, poi una progressione di quattro accordi. Per esempio in maggiore I–V–vi–IV: C (Do maggiore), G (Sol maggiore), Am (La minore), F (Fa maggiore). Non è una formula per un brano finito: è un materiale stabile su cui valutare le tue decisioni.\n\n## Procedura\n1. Disegna un ritmo semplice e lascia almeno una pausa significativa.\n2. Scrivi il basso. Canta gli arrivi senza gli accordi.\n3. Aggiungi triadi e cerca un collegamento di voci leggibile.\n4. Crea un motivo di tre o quattro note; ripetilo con una variazione.\n5. Separa i registri. Togli i raddoppi che non aggiungono una funzione.\n6. Scegli due suoni con articolazioni diverse: uno breve e uno sostenuto.\n7. Organizza presentazione, variazione, contrasto e ritorno.\n8. Verifica in mono, poi a un livello di ascolto più basso. Conserva margine sui picchi.\n\n## Diagnosi prima dei plugin\n| Sintomo | Prima ipotesi da controllare | Prova reversibile |\n|---|---|---|\n| Armonia confusa | Troppe note nel grave o code sovrapposte | Apri le voci, accorcia release |\n| Melodia senza direzione | Nessun punto d’arrivo | Allunga una nota strutturale |\n| Drop debole | Nessun contrasto precedente | Riduci densità prima dell’arrivo |\n| Stereo bello, mono vuoto | Copie correlate con ritardo | Disattiva il widening |\n| Suono più brillante ma peggiore | Livello falsato nel confronto | Compensa il guadagno |\n| Nota “sbagliata” | Funzione o spelling poco chiari | Isola basso e melodia |\n\n## Glossario essenziale\n**Tonica:** centro della tonalità o del modo. **Fondamentale dell’accordo:** riferimento che ne determina il nome. **Fondamentale acustica:** frequenza di riferimento di una serie armonica; non sempre presente fisicamente. **Basso:** voce più grave. Questi quattro concetti possono coincidere, ma non devono.\n\n**Grado:** posizione nella scala. **Intervallo:** distanza fra due altezze. **Voicing:** disposizione concreta delle note di un accordo. **Ritmo armonico:** frequenza dei cambi di armonia. **Timbro:** insieme di caratteristiche, spettrali e temporali, che distinguono i suoni oltre ad altezza e livello.\n\n**Parziale:** componente spettrale. **Armonica:** parziale a multiplo intero della fondamentale. **Gate:** intervallo fra note-on e note-off. **Headroom:** margine rispetto a un limite. **Mascheramento:** riduzione della distinguibilità di un suono in presenza di un altro.\n\n## Autovalutazione\nSai spiegare ogni nota estranea alla scala? Sai cantare la nota più alta degli accordi come una melodia? Il basso rimane leggibile? La struttura funziona prima di aumentare il volume? Sai descrivere quale variabile hai cambiato in ogni confronto? Se una risposta è no, torna al relativo laboratorio e rifai una prova piccola.\n\nIl criterio finale non è rispettare tutte le ricette: è poter scegliere, ascoltare l’effetto e correggere con intenzione. Le fonti della guida servono ad approfondire e verificare termini; gli esempi e gli esercizi sono originali.\n\n\u003c!-- LAB:progression | Implementato nell’HTML; vedi laboratori.js. -->\n\n## Verifica\n\nQuale intervento viene prima quando il pad copre il basso?\n\n1. Aumentare subito il master\n2. Controllare note, registro e durata delle voci\n3. Cambiare casualmente tutti i preset\n\n\u003cdetails>\u003csummary>Soluzione ragionata\u003c/summary>\n\nUna modifica all’arrangiamento può eliminare il conflitto alla fonte, prima di intervenire con il processing.\n\n\u003c/details>\n","html":"\u003ch2>Un brano breve che dimostra ciò che sai\u003c/h2>\n\u003cp>Costruisci 16 battute in C (Do) maggiore oppure A (La) minore. Scegli prima il centro, poi una progressione di quattro accordi. Per esempio in maggiore I–V–vi–IV: C (Do maggiore), G (Sol maggiore), Am (La minore), F (Fa maggiore). Non è una formula per un brano finito: è un materiale stabile su cui valutare le tue decisioni.\u003c/p>\n\u003ch2>Procedura\u003c/h2>\n\u003col>\n\u003cli>Disegna un ritmo semplice e lascia almeno una pausa significativa.\u003c/li>\n\u003cli>Scrivi il basso. Canta gli arrivi senza gli accordi.\u003c/li>\n\u003cli>Aggiungi triadi e cerca un collegamento di voci leggibile.\u003c/li>\n\u003cli>Crea un motivo di tre o quattro note; ripetilo con una variazione.\u003c/li>\n\u003cli>Separa i registri. Togli i raddoppi che non aggiungono una funzione.\u003c/li>\n\u003cli>Scegli due suoni con articolazioni diverse: uno breve e uno sostenuto.\u003c/li>\n\u003cli>Organizza presentazione, variazione, contrasto e ritorno.\u003c/li>\n\u003cli>Verifica in mono, poi a un livello di ascolto più basso. Conserva margine sui picchi.\u003c/li>\n\u003c/ol>\n\u003ch2>Diagnosi prima dei plugin\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Sintomo\u003c/th>\n\u003cth>Prima ipotesi da controllare\u003c/th>\n\u003cth>Prova reversibile\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Armonia confusa\u003c/td>\n\u003ctd>Troppe note nel grave o code sovrapposte\u003c/td>\n\u003ctd>Apri le voci, accorcia release\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Melodia senza direzione\u003c/td>\n\u003ctd>Nessun punto d’arrivo\u003c/td>\n\u003ctd>Allunga una nota strutturale\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Drop debole\u003c/td>\n\u003ctd>Nessun contrasto precedente\u003c/td>\n\u003ctd>Riduci densità prima dell’arrivo\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Stereo bello, mono vuoto\u003c/td>\n\u003ctd>Copie correlate con ritardo\u003c/td>\n\u003ctd>Disattiva il widening\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Suono più brillante ma peggiore\u003c/td>\n\u003ctd>Livello falsato nel confronto\u003c/td>\n\u003ctd>Compensa il guadagno\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Nota “sbagliata”\u003c/td>\n\u003ctd>Funzione o spelling poco chiari\u003c/td>\n\u003ctd>Isola basso e melodia\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2>Glossario essenziale\u003c/h2>\n\u003cp>\u003cstrong>Tonica:\u003c/strong> centro della tonalità o del modo. \u003cstrong>Fondamentale dell’accordo:\u003c/strong> riferimento che ne determina il nome. \u003cstrong>Fondamentale acustica:\u003c/strong> frequenza di riferimento di una serie armonica; non sempre presente fisicamente. \u003cstrong>Basso:\u003c/strong> voce più grave. Questi quattro concetti possono coincidere, ma non devono.\u003c/p>\n\u003cp>\u003cstrong>Grado:\u003c/strong> posizione nella scala. \u003cstrong>In
